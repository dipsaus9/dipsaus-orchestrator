# A version 4 .dipo/office.local.yaml: the version DIPO-172 added, with every key that version
# accepts. It loads next to a newer office.yaml, because each file is read at its own version.
version: 4
timeouts:
  workerStallMinutes: 25
privacy:
  keepRawEvents: true
retention:
  shortDays: 3
sandbox:
  toolchainReadPaths: ["~/.nvm/versions/node"]
