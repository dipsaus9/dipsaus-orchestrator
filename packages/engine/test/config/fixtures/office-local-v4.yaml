# A version 4 .dipo/office.local.yaml: the version DIPO-172 added, with every key that version
# accepts. sandbox.toolchainReadPaths is retired in version 14.
version: 4
timeouts:
  workerStallMinutes: 25
  permissionWaitSeconds: 60
privacy:
  keepRawEvents: true
retention:
  shortDays: 3
sandbox:
  toolchainReadPaths: ["~/.nvm/versions/node"]
