  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  --color-accent-2-200: #ffe3be;\n  --color-accent-2-300: #f5cd96;\n  --color-accent-2-400: #dbaf70;\n  --color-accent-2-500: #bc8f4e;\n  --color-accent-2-600: #9b7232;\n  --color-accent-2-700: #79561f;\n  --color-accent-2-800: #573d14;\n  --color-accent-2-900: #382810;\n\n  --font-heading: \"Cormorant Garamond\", system-ui, sans-serif;\n  --font-heading-weight: 600; /* review round 3: bold retired — semibold is the\n     interface headings' ceiling (they need the weight at small sizes); display\n     text goes lighter still, to the normal cut (see the deck) */\n  --font-body: \"Lora\", system-ui, sans-serif;\n\n  --space-1: 4.6px;\n  --space-2: 9.2px;\n  --space-3: 13.8px;\n  --space-4: 18.4px;\n  --space-6: 27.6px;\n  --space-8: 36.8px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.plate{filter:sepia(0.22) saturate(0.82) contrast(1.05);box-sizing:border-box;\n  border:6px solid var(--color-surface);outline:1px solid var(--color-divider)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: transparent;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: transparent; border: 1px solid var(--color-divider);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 1px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg); border: 1px solid var(--color-divider);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"759cd306-d180-4c33-acbb-2a77232c54e3\"><\u002Fscript>\n<style>/* cyrillic-ext */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"ebca69c2-7e83-4741-8945-f0d90b9589d0\") format('woff2');\n  unicode-range: U+0460-052F t-body)}\na{color:var(--color-accent-700);text-underline-offset:3px}\na:hover{color:var(--color-accent-600)}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"max-width:1180px;margin:0 auto;padding:64px 40px 120px;display:flex;flex-direction:column;gap:64px\">\n\n<header style=\"display:flex;flex-direction:column;gap:16px;border-bottom:1px solid var(--color-divider);padding-bottom:36px\">\n  <div style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700);font-variant-numeric:tabular-nums\">Companion to the <a href=\"dipo UX Spec.dc.html\">UX spec<\u002Fa> · read from dipsaus9/dipsaus-orchestrator · main · 6 November 2026<\u002Fdiv>\n  <h1 style=\"font-family:var(--font-heading);font-weight:400;font-size:56px;line-height:1.04;letter-spacing:-.02em;margin:0\">What the code says, where the spec was wrong, and how to get there in Ink<\u002Fh1>\n  <p style=\"max-width:70ch;margin:0;font-size:16px;text-wrap:pretty\">I read the TUI package (all of <code>packages/tui/src<\u002Fcode> that drives screens and keys), the desk and command contract, <code>docs/concepts.md<\u002Fcode>, <code>docs/how-dipo-works.md<\u002Fcode> and the M3 stories that touch the TUI. The engine is already much more precise than the screens show. Most of this redesign means <em>rendering what the engine already computes<\u002Fem>, not inventing new state.<\u002Fp>\n  <p style=\"max-width:70ch;margin:0;font-size:14px;color:var(--color-neutral-700);border-top:1px solid var(--color-divider);padding-top:12px;text-wrap:pretty\"><strong style=\"font-weight:600\">Caveat on the source.<\u002Fstrong> You asked for the local WIP folder. I could only reach GitHub <code>main<\u002Fcode> in this session, so anything your running Claude session has changed locally since the last push isn't covered. The planning-session work (DIPO-447 to 449) is the most likely place for that drift.<\u002Fp>\n<\u002Fheader>\n\n<section style=\"display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:40px\">\n  <div><div style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">§1<\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:600;font-size:32px;line-height:1.1;margin:6px 0 0\">The real state model<\u002Fh2><p style=\"font-size:14px;margin:12px 0 0;color:var(--color-neutral-700);text-wrap:pretty\">This is what the TUI has to draw. All of it is computed by the engine. The TUI never derives it.<\u002Fp><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:28px 36px;font-size:14px\">\n    <div><h5 style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 8px;font-weight:600\">Story lifecycle<\u002Fh5>\n      <div style=\"border-top:1px solid var(--color-divider);padding-top:10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.9\">Refined → Ready → In Progress → In Review → Done<br><span style=\"color:var(--color-neutral-600)\">any of them → Parked (8 reasons) → back<\u002Fspan><\u002Fdiv>\n      <p style=\"margin:8px 0 0;text-wrap:pretty\">Parked is the <em>only<\u002Fem> waiting state. Discard returns a story to Refined, and drop archives it.<\u002Fp><\u002Fdiv>\n    <div><h5 style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 8px;font-weight:600\">Run phases<\u002Fh5>\n      <div style=\"border-top:1px solid var(--color-divider);padding-top:10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.9\">setup · build · review · test · merge<\u002Fdiv>\n      <p style=\"margin:8px 0 0;text-wrap:pretty\">Verify, CI and the report gate are <em>checks<\u002Fem> inside build and merge. They aren't phases. Fix rounds loop back to build.<\u002Fp><\u002Fdiv>\n    <div><h5 style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 8px;font-weight:600\">Health<\u002Fh5>\n      <div style=\"border-top:1px solid var(--color-divider);padding-top:10px;font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.9\">busy · quiet · stuck · looping · lost<\u002Fdiv>\n      <p style=\"margin:8px 0 0;text-wrap:pretty\">Only the last three need you. The current screens print all five the same way.<\u002Fp><\u002Fdiv>\n    <div><h5 style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 8px;font-weight:600\">Park reasons<\u002Fh5>\n      <div style=\"border-top:1px solid var(--color-divider);padding-top:10px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.8\">ambiguous-spec · budget-exceeded · verify-failing · conflict · review-blocked · scope-violation · worker-failed · by-maintainer<\u002Fdiv><\u002Fdiv>\n    <div style=\"grid-column:1/-1\"><h5 style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700);margin:0 0 8px;font-weight:600\">Desk kinds, in engine order<\u002Fh5>\n      <div style=\"border-top:1px solid var(--color-divider);padding-top:10px;display:flex;flex-wrap:wrap;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px\">\n        <span class=\"tag tag-outline\">STARTS PAUSED<\u002Fspan><span class=\"tag tag-outline\">QUESTION<\u002Fspan><span class=\"tag tag-outline\">SCOPE<\u002Fspan><span class=\"tag tag-outline\">MERGE<\u002Fspan><span class=\"tag tag-outline\">PARKED<\u002Fspan><span class=\"tag tag-outline\">PR HEAD CHANGED<\u002Fspan><span class=\"tag tag-outline\">DONE ELSEWHERE<\u002Fspan><span class=\"tag tag-outline\">LEFTOVERS<\u002Fspan><span class=\"tag tag-outline\">BACKLOG PR<\u002Fspan><span class=\"tag tag-outline\">PLANNING LANE<\u002Fspan><span class=\"tag tag-outline\">NOTICE<\u002Fspan><span class=\"tag tag-outline\">PROPOSAL<\u002Fspan><span class=\"tag tag-outline\">NEXT UP<\u002Fspan><span class=\"tag tag-outline\">PARKED BY YOU<\u002Fspan><span class=\"tag tag-outline\">PROFILE<\u002Fspan><span class=\"tag tag-outline\">LOADING<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:10px 0 0;max-width:80ch;text-wrap:pretty\">Each item carries <code>detail<\u002Fcode> (one line written by code), <code>since<\u002Fcode>, <code>blocks<\u002Fcode> (which stories it holds up), <code>actions<\u002Fcode> (each with the exact <code>cli<\u002Fcode> line to type) and an optional <code>hand<\u002Fcode> (what to do by hand outside dipo). The engine already sorts them: grouped by kind in this order, then most-blocking first, then oldest. That is exactly the preview pane the spec asked for, so the TUI only needs to lay it out.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:40px\">\n  <div><div style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">§2<\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:600;font-size:32px;line-height:1.1;margin:6px 0 0\">Gap report<\u002Fh2><p style=\"font-size:14px;margin:12px 0 0;color:var(--color-neutral-700);text-wrap:pretty\">How the spec (v0.1) compares with the code on <code>main<\u002Fcode>. Each row ends with a verdict.<\u002Fp><\u002Fdiv>\n  <div style=\"overflow-x:auto\">\n  <sc-raw-table class=\"table\" style=\"width:100%;border-collapse:collapse;font-size:13.5px\">\n    <sc-raw-thead><sc-raw-tr style=\"text-align:left;border-bottom:1px solid var(--color-accent)\"><sc-raw-th style=\"font-weight:600;padding:8px 14px 8px 0;width:18%\">Topic<\u002Fsc-raw-th><sc-raw-th style=\"font-weight:600;padding:8px 14px 8px 0;width:30%\">Code today<\u002Fsc-raw-th><sc-raw-th style=\"font-weight:600;padding:8px 14px 8px 0;width:34%\">Spec v0.1 said<\u002Fsc-raw-th><sc-raw-th style=\"font-weight:600;padding:8px 0\">Verdict<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody style=\"vertical-align:top\">\n      <sc-raw-tr style=\"border-bottom:1px solid var(--color-divider)\"><sc-raw-td style=\"padding:10px 14px 10px 0;font-weight:600\">Rooms<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\"><code>1<\u002Fcode> overview · <code>2<\u002Fcode> queue · <code>3<\u002Fcode> desk · <code>4<\u002Fcode> checklist, plus <code>o<\u002Fcode> offices and <code>p<\u002Fcode> privacy<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">1 Desk · 2 Floor · 3 Queue · 4 Ledger<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0;color:var(--color-accent-700)\">Keep the spec, adjust room 4. Two rooms are coming anyway: Plan (DIPO-449) and Retro (DIPO-453).<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--color-divider)\"><sc-raw-td style=\"padding:10px 14px 10px 0;font-weight:600\">Checklist<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">The manual test steps of the story's open test, ticked locally. <code>P<\u002Fcode> passes, <code>F<\u002Fcode> fails with a note.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">Open question<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0;color:var(--color-accent-700)\">Not a room. It's the second half of <code>t<\u002Fcode> test on a MERGE item: an overlay tied to the open test.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--color-divider)\"><sc-raw-td style=\"padding:10px 14px 10px 0;font-weight:600\">Pipeline<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">Phases are setup, build, review, test and merge<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">build, verify, review, merge<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0;color:var(--color-err, #a33a2b)\">Spec wrong. Use the five real phases, and show verify and CI as ✓/✗ marks inside build and merge.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--color-divider)\"><sc-raw-td style=\"padding:10px 14px 10px 0;font-weight:600\">Desk contents<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">16 kinds, ordered by the engine, each with <code>cli<\u002Fcode> lines<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">Setup + proposals<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0;color:var(--color-accent-700)\">Extend. Group headers follow the engine's kind order. The preview shows the <code>cli<\u002Fcode> line under the buttons, so the TUI teaches the CLI.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--color-divider)\"><sc-raw-td style=\"padding:10px 14px 10px 0;font-weight:600\">Accept proposal<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">Files a Backlog <em>draft<\u002Fem> through the planning lane, as one backlog PR<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">“Accept → Ready”<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0;color:var(--color-err, #a33a2b)\">Spec wrong. The consequence line becomes “Files a draft. You refine it in a planning session.”<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--color-divider)\"><sc-raw-td style=\"padding:10px 14px 10px 0;font-weight:600\">Duplicate proposals<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">The engine de-dupes on the same title <em>and<\u002Fem> paths. Same title with different paths makes two rows (your screenshot).<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">Merge in the UI as “×2”<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0;color:var(--color-accent-700)\">Keep as a display grouping, and show both path sets in the preview.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--color-divider)\"><sc-raw-td style=\"padding:10px 14px 10px 0;font-weight:600\">Next up<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">The NEXT UP desk item offers a Ready story for a free slot, and nothing starts until you confirm (DIPO-440)<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">Floor “Up next” as a sentence<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0;color:var(--color-accent-700)\">Merge them. The Floor shows the chain, and the NEXT UP item on the Desk takes y/n to confirm or decline.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--color-divider)\"><sc-raw-td style=\"padding:10px 14px 10px 0;font-weight:600\">“skipped DIPO-448…” block<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">The <code>RunResult.skipped<\u002Fcode> of the last <code>u<\u002Fcode> run stays printed in the panel under every view<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">Ticker + Queue reason column<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0;color:var(--color-ok, #3f6b2f)\">Confirmed. It's a transient result that never gets cleared, so this is the single biggest source of clutter.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--color-divider)\"><sc-raw-td style=\"padding:10px 14px 10px 0;font-weight:600\">Header line<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">office · daemon state · connection, then a line of counts, privacy words and tokens<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">Office, daemon dot, spend, clock<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0;color:var(--color-ok, #3f6b2f)\">Confirmed. Privacy words (<code>storedLabel<\u002Fcode>) move to the palette and settings.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--color-divider)\"><sc-raw-td style=\"padding:10px 14px 10px 0;font-weight:600\">Keys<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">One <code>KEY_TABLE<\u002Fcode>. <code>y<\u002Fcode>/<code>n<\u002Fcode> = approve/accept · reject/dismiss. <code>P<\u002Fcode> = park <em>and<\u002Fem> pass. <code>p<\u002Fcode> = privacy. <code>u<\u002Fcode> = run. <code>q<\u002Fcode> twice quits.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\"><code>a<\u002Fcode> accept, <code>d<\u002Fcode> dismiss, <code>p<\u002Fcode> park<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0;color:var(--color-err, #a33a2b)\">Spec wrong on a/d. In code <code>a<\u002Fcode> is answer and <code>d<\u002Fcode> is drop. Use <code>y<\u002Fcode>/<code>n<\u002Fcode> everywhere as “yes / no to what this item asks” (§3).<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--color-divider)\"><sc-raw-td style=\"padding:10px 14px 10px 0;font-weight:600\">Narrow<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">Below 60 columns or 16 rows it shows one list with “widen for detail”<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">Same threshold plus a 100-column split<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0;color:var(--color-ok, #3f6b2f)\">Aligned. Add the 100-column split breakpoint.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--color-divider)\"><sc-raw-td style=\"padding:10px 14px 10px 0;font-weight:600\">Colour<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">Everything goes through <code>Colored<\u002Fcode>. NO_COLOR and an ASCII mode are already supported (<code>display.ascii<\u002Fcode>).<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">9 roles on ANSI slots<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0;color:var(--color-accent-700)\">A perfect seam. Change <code>color?: string<\u002Fcode> to <code>role?: Role<\u002Fcode>. The spec's glyphs also need ASCII twins (§4).<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--color-divider)\"><sc-raw-td style=\"padding:10px 14px 10px 0;font-weight:600\">States<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">Banners for OFFLINE (view frozen), recovering, database unavailable and draining. Actions show pending until the stream passes the reply cursor. <code>Ctrl-R<\u002Fcode> retries.<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">Empty, daemon down, budget, failed<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0;color:var(--color-accent-700)\">Extend the spec with offline/frozen, recovering, a pending action and retry.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr style=\"border-bottom:1px solid var(--color-divider)\"><sc-raw-td style=\"padding:10px 14px 10px 0;font-weight:600\">Notifications<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">The Mac posts a notification when a new desk item arrives<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">Open question<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0;color:var(--color-ok, #3f6b2f)\">Answered. It already exists.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <sc-raw-tr><sc-raw-td style=\"padding:10px 14px 10px 0;font-weight:600\">Multiple offices<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">The switcher shows RUNNING, NEEDS YOU, READY and TODAY per office from <code>office.summary<\u002Fcode><\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 14px 10px 0\">Open question<\u002Fsc-raw-td><sc-raw-td style=\"padding:10px 0;color:var(--color-accent-700)\">Feasible now. The header shows “+2 elsewhere” when another office's desk is above zero.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:40px\">\n  <div><div style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">§3<\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:600;font-size:32px;line-height:1.1;margin:6px 0 0\">Spec v0.2: the keymap, reconciled<\u002Fh2><p style=\"font-size:14px;margin:12px 0 0;color:var(--color-neutral-700);text-wrap:pretty\">This keeps your existing muscle memory (<code>y<\u002Fcode>/<code>n<\u002Fcode>, <code>s<\u002Fcode>, <code>r<\u002Fcode>, <code>t<\u002Fcode>, <code>a<\u002Fcode>) and removes every collision.<\u002Fp><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px 40px;font-size:14px\">\n    <div style=\"display:grid;grid-template-columns:7ch 1fr;gap:7px 12px;border-top:1px solid var(--color-divider);padding-top:12px;align-content:start\">\n      <code style=\"color:var(--color-accent-700)\">y<\u002Fcode><span><strong style=\"font-weight:600\">yes<\u002Fstrong> to what the item asks: approve a merge, accept a proposal, confirm next up, pass a test<\u002Fspan>\n      <code style=\"color:var(--color-accent-700)\">n<\u002Fcode><span><strong style=\"font-weight:600\">no<\u002Fstrong>: reject, dismiss, decline, or fail a test. Asks for a note when the command needs one.<\u002Fspan>\n      <code style=\"color:var(--color-accent-700)\">a<\u002Fcode><span>answer a question<\u002Fspan>\n      <code style=\"color:var(--color-accent-700)\">r<\u002Fcode><span>resume a park (asks for a note or budget when the reason needs it)<\u002Fspan>\n      <code style=\"color:var(--color-accent-700)\">t<\u002Fcode><span>start a test, which opens the checklist overlay<\u002Fspan>\n      <code style=\"color:var(--color-accent-700)\">s<\u002Fcode><span>steer the running worker<\u002Fspan>\n      <code style=\"color:var(--color-accent-700)\">p<\u002Fcode><span>park. Lowercase now that privacy has moved to the palette.<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:7ch 1fr;gap:7px 12px;border-top:1px solid var(--color-divider);padding-top:12px;align-content:start\">\n      <code style=\"color:var(--color-accent-700)\">R<\u002Fcode><span>run selected (was <code>u<\u002Fcode>). Capital, because it starts spending.<\u002Fspan>\n      <code style=\"color:var(--color-accent-700)\">X<\u002Fcode><span>drop (was <code>d<\u002Fcode>). Already asks for confirmation.<\u002Fspan>\n      <code style=\"color:var(--color-accent-700)\">D<\u002Fcode><span>discard. Unchanged, asks for the id typed out.<\u002Fspan>\n      <code style=\"color:var(--color-accent-700)\">o<\u002Fcode><span>open the PR or comment in the browser<\u002Fspan>\n      <code style=\"color:var(--color-accent-700)\">O<\u002Fcode><span>offices (was <code>o<\u002Fcode>)<\u002Fspan>\n      <code style=\"color:var(--color-accent-700)\">^R<\u002Fcode><span>retry a failed action, unchanged<\u002Fspan>\n      <code style=\"color:var(--color-accent-700)\">q q<\u002Fcode><span>quit, unchanged (twice within 2 s)<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"grid-column:1/-1;margin:0;font-size:13px;color:var(--color-neutral-700);max-width:80ch;text-wrap:pretty\">The rule behind it is that lowercase letters act on the focused item and are always safe or undoable. Capitals start spending or destroy something. Digits switch rooms. Symbols (<code>: / ? .<\u002Fcode>) open tools. Every <code>DeskAction<\u002Fcode> without a key still shows its <code>cli<\u002Fcode> line, which the code already does.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:40px\">\n  <div><div style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">§4<\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:600;font-size:32px;line-height:1.1;margin:6px 0 0\">Glyphs with ASCII twins<\u002Fh2><p style=\"font-size:14px;margin:12px 0 0;color:var(--color-neutral-700);text-wrap:pretty\"><code>glyphs(ascii)<\u002Fcode> already exists for <code>· – …<\u002Fcode>. Extend it.<\u002Fp><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 24px;font-family:'JetBrains Mono',monospace;font-size:13px;border-top:1px solid var(--color-divider);padding-top:14px\">\n    <span><span style=\"color:var(--color-accent-700)\">●  *<\u002Fspan>  running<\u002Fspan><span><span style=\"color:var(--color-accent-700)\">○  o<\u002Fspan>  waiting<\u002Fspan><span><span style=\"color:var(--color-accent-700)\">✓  +<\u002Fspan>  met / passed<\u002Fspan><span><span style=\"color:var(--color-accent-700)\">✗  x<\u002Fspan>  failed<\u002Fspan><span><span style=\"color:var(--color-accent-700)\">◆  #<\u002Fspan>  proposal<\u002Fspan><span><span style=\"color:var(--color-accent-700)\">!  !<\u002Fspan>  needs judgement<\u002Fspan><span><span style=\"color:var(--color-accent-700)\">▌  &gt;<\u002Fspan>  focus<\u002Fspan><span><span style=\"color:var(--color-accent-700)\">━  =<\u002Fspan>  phase done<\u002Fspan><span><span style=\"color:var(--color-accent-700)\">┄  .<\u002Fspan>  phase to come<\u002Fspan><span><span style=\"color:var(--color-accent-700)\">│  |<\u002Fspan>  pane rule<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:40px\">\n    <div><div style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">§5<\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:600;font-size:32px;line-height:1.1;margin:6px 0 0\">Migration plan for the Ink components<\u002Fh2><\u002Fdiv>\n    <p style=\"margin:0;max-width:72ch;font-size:15px;text-wrap:pretty\">There are seven steps. Each one is a story dipo can run on its own, and each ships something visible. The order puts the clutter fixes first because they're the cheapest. They depend on <strong style=\"font-weight:600\">DIPO-443<\u002Fstrong> (one part per mode), which is already done, and they line up with M3's Plan (449) and Retro (453) views so those land inside the new frame rather than the old one.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;border-top:1px solid var(--color-divider)\">\n    <sc-for list=\"{{ steps }}\" as=\"s\" hint-placeholder-count=\"7\">\n      <div style=\"display:grid;grid-template-columns:72px minmax(0,1.1fr) minmax(0,1fr) 120px;gap:24px;padding:18px 0;border-bottom:1px solid var(--color-divider);align-items:start\">\n        <div style=\"font-family:var(--font-heading);font-size:40px;line-height:1;color:var(--color-accent);font-variant-numeric:tabular-nums\">{{ s.n }}<\u002Fdiv>\n        <div><h4 style=\"font-family:var(--font-heading);font-weight:600;font-size:21px;margin:0 0 4px\">{{ s.title }}<\u002Fh4><p style=\"margin:0;font-size:14px;text-wrap:pretty\">{{ s.what }}<\u002Fp><\u002Fdiv>\n        <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;color:var(--color-neutral-700);white-space:pre-wrap\">{{ s.files }}<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:6px;align-items:flex-start\"><span class=\"tag tag-outline\" style=\"font-family:'JetBrains Mono',monospace;font-size:11px\">tier {{ s.tier }}<\u002Fspan><span style=\"font-size:12px;color:var(--color-neutral-700)\">{{ s.after }}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:40px\">\n  <div><div style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--color-accent-700)\">§6<\u002Fdiv><h2 style=\"font-family:var(--font-heading);font-weight:600;font-size:32px;line-height:1.1;margin:6px 0 0\">Architecture notes from the backlog<\u002Fh2><\u002Fdiv>\n  <ul style=\"margin:0;padding-left:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px 40px;font-size:14px;text-wrap:pretty\">\n    <li><strong style=\"font-weight:600\">The boundary is clean.<\u002Fstrong> The TUI can't import the engine, and only <code>contract<\u002Fcode> and <code>client<\u002Fcode> sit between them. Everything here is TUI-only except two small contract additions: spend in the office summary for the header, and an optional <code>consequence<\u002Fcode> line on <code>DeskAction<\u002Fcode>.<\u002Fli>\n    <li><strong style=\"font-weight:600\">M3 adds two views.<\u002Fstrong> DIPO-449 needs a multi-line input (Enter adds a line, one key sends). Build it once in step 1 as <code>&lt;Composer&gt;<\u002Fcode> and reuse it for steer, answer and reject notes, which are single-line today.<\u002Fli>\n    <li><strong style=\"font-weight:600\">The retro (DIPO-453) replaces the “Ledger” idea.<\u002Fstrong> Done stories, park reasons, rounds, cost and rework all come from the database. Room 4 becomes <em>Retro<\u002Fem>.<\u002Fli>\n    <li><strong style=\"font-weight:600\">The Desk is already engine-ordered.<\u002Fstrong> Resist re-sorting in the TUI, because the engine's order (starts paused first, then by blocks and age) is the decision you made in ADR 0020.<\u002Fli>\n    <li><strong style=\"font-weight:600\">Evidence labels<\u002Fstrong> (checked, claimed, estimated) are hidden by decision 0009. A dim <code>~<\u002Fcode> before estimated numbers (like “~11:20 next decision”) would be honest without the noise.<\u002Fli>\n    <li><strong style=\"font-weight:600\">The footer's <code>fitHints<\u002Fcode> priority dropping<\u002Fstrong> is good and stays. The registry gives each verb its priority instead of hard-coding it per view.<\u002Fli>\n  <\u002Ful>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    return { steps: [\n      { n: '1', tier: 'M', after: 'needs nothing', title: 'Foundations: roles, Frame, action registry', what: 'Colored takes a role instead of a raw colour. A <Frame> owns header, rooms, body, ticker and keys. KEY_TABLE grows label, when() and priority, and footer, help and palette all read from it. Add the <Composer> multi-line input. Nothing visible changes yet apart from the colours.', files: 'colour.tsx → role\\nscreen.tsx → Frame\\nkeys.ts → registry\\nfooter.ts reads registry\\n+ composer.tsx' },\n      { n: '2', tier: 'S', after: 'after 1', title: 'Quiet down', what: 'Clear the RunResult skipped block after the next key and send it to the ticker. Show skip reasons as a column in the Queue. Move privacy words out of the header. Remap keys per §3.', files: 'app.tsx (panel)\\nqueue.tsx (reason col)\\nviews.tsx Header\\nkeys.ts' },\n      { n: '3', tier: 'M', after: 'after 2', title: 'Desk with preview', what: 'Split the list and preview at 100 columns or wider. Kind group headers. The preview shows detail, blocks, since, hand, buttons for bound actions and cli lines for unbound ones. Same-title proposals group together. NEXT UP gets y/n.', files: 'desk.tsx split\\n+ desk-preview.tsx\\nkeys.ts rowKeys' },\n      { n: '4', tier: 'M', after: 'after 1', title: 'Floor and pipeline line', what: 'Overview becomes the Floor. One <Pipeline phase checks> component with the five real phases, used everywhere. RUNNING and IN REVIEW become exclusive. Health only shows when it is stuck, looping or lost. Add the Up next chain.', files: 'overview.tsx\\n+ pipeline.tsx\\nrun.tsx' },\n      { n: '5', tier: 'M', after: 'after 4', title: 'Run stream as a table', what: 'Fold thinking runs. Show time, verb and target columns. Make says and verdict bright. w, v and i become stream filter tabs. Scrolling up pauses following. Steer opens the Composer inline.', files: 'output.ts fold\\ndetail.tsx tabs\\nlive tail via <Static>' },\n      { n: '6', tier: 'S', after: 'after 3', title: 'Story reader and test overlay', what: 'The story card gets Story, Criteria, Reviews, Runs and Diff sections, centred at 84 columns, with wrapping instead of truncation. The checklist leaves room 4 and becomes the overlay opened by t, with y/n for pass/fail.', files: 'story-card.tsx\\nchecklist.tsx → overlay\\ndetail.tsx' },\n      { n: '7', tier: 'M', after: 'after 1, with 449/453', title: 'Palette, help, new rooms', what: 'Command palette (: and ctrl-k) and the ? overlay from the registry. Settings and privacy live there. Plan (DIPO-449) and Retro (DIPO-453) mount as rooms inside the Frame.', files: '+ palette.tsx\\n+ help.tsx\\nsettings.tsx → palette\\nplan / retro rooms' }\n    ] };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
