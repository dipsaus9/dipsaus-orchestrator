er/100% 1px no-repeat\"><\u002Fdiv><div><span style=\"color:var(--t-acc)\">t<\u002Fspan> test   <span style=\"color:var(--t-acc)\">y<\u002Fspan> approve   <span style=\"color:var(--t-acc)\">n<\u002Fspan> reject<\u002Fdiv><\u002Fdiv><\u002Fdiv><figcaption style=\"font-family:Lora,serif;font-size:13px;color:#605d5d;text-wrap:pretty\"><strong style=\"font-weight:600\">16 colors, light.<\u002Fstrong> Mapped to ANSI slots: yellow becomes a dark amber, and bright black is the dim role. Nothing is painted on the background except the focus row.<\u002Ffigcaption><\u002Ffigure><figure style=\"margin:0;display:flex;flex-direction:column;gap:8px\"><div style=\"--t-bg:#0c0c0c;--t-fg:#cccccc;--t-hi:#ffffff;--t-dim:#808080;--t-faint:#4a4a4a;--t-acc:#d7af00;--t-ok:#5faf00;--t-err:#d75f5f;--t-sel:#262626;border:1px solid rgba(32,31,29,.2);border-radius:4px;overflow-x:auto\"><div style=\"white-space:pre;display:flex;flex-direction:column;line-height:1.55;background:var(--t-bg);color:var(--t-fg);padding:1.2em 2ch;min-height:17em\"><div style=\"display:flex;justify-content:space-between\"><span><span style=\"color:var(--t-acc);font-weight:600\">dipo<\u002Fspan><span style=\"color:var(--t-dim)\"> / <\u002Fspan>dipsaus-orch…<\u002Fspan><span><span style=\"color:var(--t-ok)\">●<\u002Fspan><span style=\"color:var(--t-dim)\"> live 13:44<\u002Fspan><\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:3ch;margin-top:.4em\"><span style=\"color:var(--t-hi);text-decoration:underline 1px var(--t-acc);text-underline-offset:5px\">1 Desk <span style=\"color:var(--t-acc)\">6<\u002Fspan><\u002Fspan><span style=\"color:var(--t-dim)\">2 Floor 2<\u002Fspan><span style=\"color:var(--t-dim)\">3 Queue<\u002Fspan><\u002Fdiv><div style=\"height:1.55em;background:linear-gradient(var(--t-faint),var(--t-faint)) center/100% 1px no-repeat\"><\u002Fdiv><div style=\"color:var(--t-dim)\">MERGE<\u002Fdiv><div style=\"display:flex;background:var(--t-sel)\"><span style=\"width:2ch;color:var(--t-acc)\">▌<\u002Fspan><span style=\"color:var(--t-acc);width:2ch\">○<\u002Fspan><span style=\"flex:1;color:var(--t-hi)\">DIPO-446 Planning tools<\u002Fspan><span style=\"color:var(--t-dim)\">8m<\u002Fspan><\u002Fdiv><div style=\"background:var(--t-sel)\"><span style=\"color:var(--t-ok)\">    setup ━ build ✓ ━ review ✓ ━ <\u002Fspan><span style=\"color:var(--t-acc)\">● test<\u002Fspan><span style=\"color:var(--t-faint)\"> ┄ merge<\u002Fspan><\u002Fdiv><div style=\"color:var(--t-dim)\">PARKED<\u002Fdiv><div style=\"display:flex\"><span style=\"width:2ch\"> <\u002Fspan><span style=\"color:var(--t-err);width:2ch\">✗<\u002Fspan><span style=\"flex:1\">DIPO-447 budget reached<\u002Fspan><span style=\"color:var(--t-dim)\">31m<\u002Fspan><\u002Fdiv><div style=\"height:1.55em;background:linear-gradient(var(--t-faint),var(--t-faint)) center/100% 1px no-repeat\"><\u002Fdiv><div><span style=\"color:var(--t-acc)\">t<\u002Fspan> test   <span style=\"color:var(--t-acc)\">y<\u002Fspan> approve   <span style=\"color:var(--t-acc)\">n<\u002Fspan> reject<\u002Fdiv><\u002Fdiv><\u002Fdiv><figcaption style=\"font-family:Lora,serif;font-size:13px;color:#605d5d;text-wrap:pretty\"><strong style=\"font-weight:600\">16 colors, dark.<\u002Fstrong> The default most users get. Its contrast matches truecolor dark closely enough that the screens above hold.<\u002Ffigcaption><\u002Ffigure><figure style=\"margin:0;display:flex;flex-direction:column;gap:8px\"><div style=\"--t-bg:#0c0c0c;--t-fg:#cccccc;--t-hi:#cccccc;--t-dim:#cccccc;--t-faint:#cccccc;--t-acc:#cccccc;--t-ok:#cccccc;--t-err:#cccccc;--t-sel:#0c0c0c;border:1px solid rgba(32,31,29,.2);border-radius:4px;overflow-x:auto\"><div style=\"white-space:pre;display:flex;flex-direction:column;line-height:1.55;background:var(--t-bg);color:var(--t-fg);padding:1.2em 2ch;min-height:17em\"><div style=\"display:flex;justify-content:space-between\"><span><span style=\"color:var(--t-acc);font-weight:600\">dipo<\u002Fspan><span style=\"color:var(--t-dim)\"> / <\u002Fspan>dipsaus-orch…<\u002Fspan><span><span style=\"color:var(--t-ok)\">●<\u002Fspan><span style=\"color:var(--t-dim)\"> live 13:44<\u002Fspan><\u002Fspan><\u002Fdiv><div style=\"display:flex;gap:3ch;margin-top:.4em\"><span style=\"color:var(--t-hi);text-decoration:underline 1px var(--t-acc);text-underline-offset:5px\">1 Desk <span style=\"color:var(--t-acc)\">6<\u002Fspan><\u002Fspan><span style=\"color:var(--t-dim)\">2 Floor 2<\u002Fspan><span style=\"color:var(--t-dim)\">3 Queue<\u002Fspan><\u002Fdiv><div style=\"height:1.55em;background:linear-gradient(var(--t-faint),var(--t-faint)) center/100% 1px no-repeat\"><\u002Fdiv><div style=\"color:var(--t-dim)\">MERGE<\u002Fdiv><div style=\"display:flex;background:var(--t-sel)\"><span style=\"width:2ch;color:var(--t-acc)\">▌<\u002Fspan><span style=\"color:var(--t-acc);width:2ch\">○<\u002Fspan><span style=\"flex:1;color:var(--t-hi)\">DIPO-446 Planning tools<\u002Fspan><span style=\"color:var(--t-dim)\">8m<\u002Fspan><\u002Fdiv><div style=\"background:var(--t-sel)\"><span style=\"color:var(--t-ok)\">    setup ━ build ✓ ━ review ✓ ━ <\u002Fspan><span style=\"color:var(--t-acc)\">● test<\u002Fspan><span style=\"color:var(--t-faint)\"> ┄ merge<\u002Fspan><\u002Fdiv><div style=\"color:var(--t-dim)\">PARKED<\u002Fdiv><div style=\"display:flex\"><span style=\"width:2ch\"> <\u002Fspan><span style=\"color:var(--t-err);width:2ch\">✗<\u002Fspan><span style=\"flex:1\">DIPO-447 budget reached<\u002Fspan><span style=\"color:var(--t-dim)\">31m<\u002Fspan><\u002Fdiv><div style=\"height:1.55em;background:linear-gradient(var(--t-faint),var(--t-faint)) center/100% 1px no-repeat\"><\u002Fdiv><div><span style=\"color:var(--t-acc)\">t<\u002Fspan> test   <span style=\"color:var(--t-acc)\">y<\u002Fspan> approve   <span style=\"color:var(--t-acc)\">n<\u002Fspan> reject<\u002Fdiv><\u002Fdiv><\u002Fdiv><figcaption style=\"font-family:Lora,serif;font-size:13px;color:#605d5d;text-wrap:pretty\"><strong style=\"font-weight:600\">NO_COLOR.<\u002Fstrong> Every state still reads, through glyphs (▌ ○ ✗ ━ ┄) and words. That’s the test the spec’s “color is never the only signal” rule has to pass. Add <code>--ascii<\u002Fcode> and the glyphs become their ASCII twins.<\u002Ffigcaption><\u002Ffigure><\u002Fdiv><\u002Fsection>\n\n<section style=\"display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:40px\">\n  <div><div style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7d5411\">§7<\u002Fdiv><h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;line-height:1.1;margin:6px 0 0\">Keymap<\u002Fh2><p style=\"font-size:14px;margin:12px 0 0;text-wrap:pretty\">Four layers. Layer 0 is enough to use dipo. Each layer above it is optional speed. Lowercase letters are verbs and never navigate.<\u002Fp><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:28px 40px;font-size:14px\">\n    <div><h5 style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7d5411;margin:0 0 8px;font-weight:600\">L0 · everyone<\u002Fh5>\n      <div style=\"display:grid;grid-template-columns:9ch 1fr;gap:6px 12px;border-top:1px solid rgba(32,31,29,.16);padding-top:10px\">\n        <code style=\"color:#7d5411\">↑ ↓<\u002Fcode><span>move focus<\u002Fspan><code style=\"color:#7d5411\">⏎<\u002Fcode><span>open / drill in<\u002Fspan><code style=\"color:#7d5411\">esc<\u002Fcode><span>back / close<\u002Fspan><code style=\"color:#7d5411\">tab<\u002Fcode><span>next pane<\u002Fspan><code style=\"color:#7d5411\">1–4<\u002Fcode><span>Desk, Floor, Queue, Retro<\u002Fspan><code style=\"color:#7d5411\">?<\u002Fcode><span>keys for this screen<\u002Fspan><code style=\"color:#7d5411\">q<\u002Fcode><span>quit (daemon keeps working)<\u002Fspan>\n      <\u002Fdiv><\u002Fdiv>\n    <div><h5 style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7d5411;margin:0 0 8px;font-weight:600\">L1 · verbs on the focused item<\u002Fh5>\n      <div style=\"display:grid;grid-template-columns:9ch 1fr;gap:6px 12px;border-top:1px solid rgba(32,31,29,.16);padding-top:10px\">\n        <code style=\"color:#7d5411\">y<\u002Fcode><span>yes: approve, accept, confirm next up, pass a test<\u002Fspan><code style=\"color:#7d5411\">n<\u002Fcode><span>no: reject, dismiss, decline, or fail (asks for a note)<\u002Fspan><code style=\"color:#7d5411\">a<\u002Fcode><span>answer a question<\u002Fspan><code style=\"color:#7d5411\">r<\u002Fcode><span>resume a park<\u002Fspan><code style=\"color:#7d5411\">t<\u002Fcode><span>start a test, which opens the checklist<\u002Fspan><code style=\"color:#7d5411\">s<\u002Fcode><span>steer the worker<\u002Fspan><code style=\"color:#7d5411\">p<\u002Fcode><span>park<\u002Fspan><code style=\"color:#7d5411\">R X D<\u002Fcode><span>run · drop · discard (capitals spend or destroy)<\u002Fspan>\n      <\u002Fdiv><\u002Fdiv>\n    <div><h5 style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7d5411;margin:0 0 8px;font-weight:600\">L2 · vim motions<\u002Fh5>\n      <div style=\"display:grid;grid-template-columns:9ch 1fr;gap:6px 12px;border-top:1px solid rgba(32,31,29,.16);padding-top:10px\">\n        <code style=\"color:#7d5411\">j k<\u002Fcode><span>move<\u002Fspan><code style=\"color:#7d5411\">h l<\u002Fcode><span>back / open<\u002Fspan><code style=\"color:#7d5411\">g G<\u002Fcode><span>top / bottom (G follows the stream)<\u002Fspan><code style=\"color:#7d5411\">/<\u002Fcode><span>filter list<\u002Fspan><code style=\"color:#7d5411\">n N<\u002Fcode><span>next / previous match<\u002Fspan><code style=\"color:#7d5411\">y<\u002Fcode><span>copy id<\u002Fspan>\n      <\u002Fdiv><\u002Fdiv>\n    <div><h5 style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7d5411;margin:0 0 8px;font-weight:600\">L3 · everything else<\u002Fh5>\n      <div style=\"display:grid;grid-template-columns:9ch 1fr;gap:6px 12px;border-top:1px solid rgba(32,31,29,.16);padding-top:10px\">\n        <code style=\"color:#7d5411\">:<\u002Fcode><span>command palette<\u002Fspan><code style=\"color:#7d5411\">ctrl-k<\u002Fcode><span>same, for non-vim hands<\u002Fspan><code style=\"color:#7d5411\">O<\u002Fcode><span>switch office (capital O, from anywhere)<\u002Fspan><code style=\"color:#7d5411\">P<\u002Fcode><span>open or continue the planning session<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"margin:12px 0 0;font-size:13px;color:#605d5d;text-wrap:pretty\">Confirm only for actions you can't undo: stopping a run and dismissing a setup issue. Everything else is instant with undo.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:40px\">\n  <div><div style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7d5411\">§8<\u002Fdiv><h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;line-height:1.1;margin:6px 0 0\">Color and glyphs<\u002Fh2><p style=\"font-size:14px;margin:12px 0 0;text-wrap:pretty\">There are nine roles, each mapped to an ANSI slot, so dipo picks up the user's terminal theme in both light and dark. Truecolor is an opt-in “Classical” theme: ink, paper and one gold. The Tweaks panel switches every mock on this page.<\u002Fp><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:28px\">\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;font-size:13px\">\n      <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"width:34px;height:34px;border-radius:2px;border:1px solid rgba(32,31,29,.2);background:var(--t-bg)\"><\u002Fspan><span><strong style=\"font-weight:600\">bg<\u002Fstrong> · default bg<br><span style=\"color:#605d5d\">never painted in 16-color<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"width:34px;height:34px;border-radius:2px;border:1px solid rgba(32,31,29,.2);background:var(--t-fg)\"><\u002Fspan><span><strong style=\"font-weight:600\">fg<\u002Fstrong> · default fg<br><span style=\"color:#605d5d\">body text<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"width:34px;height:34px;border-radius:2px;border:1px solid rgba(32,31,29,.2);background:var(--t-hi)\"><\u002Fspan><span><strong style=\"font-weight:600\">hi<\u002Fstrong> · bold fg<br><span style=\"color:#605d5d\">titles, agent's words<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"width:34px;height:34px;border-radius:2px;border:1px solid rgba(32,31,29,.2);background:var(--t-dim)\"><\u002Fspan><span><strong style=\"font-weight:600\">dim<\u002Fstrong> · bright black<br><span style=\"color:#605d5d\">labels, meta, ticker<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"width:34px;height:34px;border-radius:2px;border:1px solid rgba(32,31,29,.2);background:var(--t-faint)\"><\u002Fspan><span><strong style=\"font-weight:600\">faint<\u002Fstrong> · bright black<br><span style=\"color:#605d5d\">rules, future stages<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"width:34px;height:34px;border-radius:2px;border:1px solid rgba(32,31,29,.2);background:var(--t-acc)\"><\u002Fspan><span><strong style=\"font-weight:600\">accent<\u002Fstrong> · yellow<br><span style=\"color:#605d5d\">keys, focus bar, now<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"width:34px;height:34px;border-radius:2px;border:1px solid rgba(32,31,29,.2);background:var(--t-ok)\"><\u002Fspan><span><strong style=\"font-weight:600\">ok<\u002Fstrong> · green<br><span style=\"color:#605d5d\">live, done, met<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"width:34px;height:34px;border-radius:2px;border:1px solid rgba(32,31,29,.2);background:var(--t-err)\"><\u002Fspan><span><strong style=\"font-weight:600\">err<\u002Fstrong> · red<br><span style=\"color:#605d5d\">failed, blocked<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:center\"><span style=\"width:34px;height:34px;border-radius:2px;border:1px solid rgba(32,31,29,.2);background:var(--t-sel)\"><\u002Fspan><span><strong style=\"font-weight:600\">sel<\u002Fstrong> · inverse fallback<br><span style=\"color:#605d5d\">focused row<\u002Fspan><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 24px;font-size:13px;border-top:1px solid rgba(32,31,29,.16);padding-top:16px\">\n      <span><code style=\"font-family:'JetBrains Mono',monospace;color:#7d5411;font-size:15px\">● ○<\u002Fcode>  running · waiting on someone<\u002Fspan>\n      <span><code style=\"font-family:'JetBrains Mono',monospace;color:#7d5411;font-size:15px\">✓ ✗<\u002Fcode>  met / passed · failed<\u002Fspan>\n      <span><code style=\"font-family:'JetBrains Mono',monospace;color:#7d5411;font-size:15px\">!<\u002Fcode>  needs judgement<\u002Fspan>\n      <span><code style=\"font-family:'JetBrains Mono',monospace;color:#7d5411;font-size:15px\">◆<\u002Fcode>  proposal<\u002Fspan>\n      <span><code style=\"font-family:'JetBrains Mono',monospace;color:#7d5411;font-size:15px\">▌<\u002Fcode>  focus bar<\u002Fspan>\n      <span><code style=\"font-family:'JetBrains Mono',monospace;color:#7d5411;font-size:15px\">━ ┄<\u002Fcode>  pipeline done · to come<\u002Fspan>\n      <span><code style=\"font-family:'JetBrains Mono',monospace;color:#7d5411;font-size:15px\">│ ─<\u002Fcode>  pane borders only<\u002Fspan>\n      <span><code style=\"font-family:'JetBrains Mono',monospace;color:#7d5411;font-size:15px\">··<\u002Fcode>  folded thinking<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:13px;color:#605d5d;max-width:72ch;text-wrap:pretty\">Box Drawing, Geometric Shapes and two Dingbats only, with no Nerd Font glyphs. Color is never the only signal: every state has a glyph too, so <code>NO_COLOR=1<\u002Fcode> still reads.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:40px\">\n  <div><div style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7d5411\">§9<\u002Fdiv><h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;line-height:1.1;margin:6px 0 0\">Building it in Ink<\u002Fh2><\u002Fdiv>\n  <ul style=\"margin:0;padding-left:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px 40px;font-size:14px;text-wrap:pretty\">\n    <li>Use one <code>&lt;Frame&gt;<\u002Fcode> component for header, rooms, body, ticker and keys. Screens only provide the body and a <code>keys<\u002Fcode> array, and the same array feeds the footer, the <code>?<\u002Fcode> overlay and the palette.<\u002Fli>\n    <li>Keep a single action registry: <code>{id, key, label, when(item), run}<\u002Fcode>. Footer, palette and mouse all read from it, which keeps keys consistent by construction.<\u002Fli>\n    <li>Render the run stream with <code>&lt;Static&gt;<\u002Fcode> for finished lines and a live tail below it, so the screen doesn't flicker at 255 turns.<\u002Fli>\n    <li>Read layout from <code>useStdout().columns<\u002Fcode>. At 100 or more columns, show split panes. Between 60 and 99, use a single pane. Below 60, show the widen message.<\u002Fli>\n    <li>Detect the theme by querying the terminal background (OSC 11), falling back to <code>COLORFGBG<\u002Fcode>, then to dark. Respect <code>NO_COLOR<\u002Fcode>.<\u002Fli>\n    <li>For mouse support, enable SGR mouse mode (1006). A click maps to focus, a double-click to ⏎, and the wheel scrolls the pane under the cursor.<\u002Fli>\n  <\u002Ful>\n<\u002Fsection>\n\n<section style=\"display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:40px;border-top:1px solid #b68235;padding-top:32px\">\n  <div><div style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7d5411\">§10<\u002Fdiv><h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;line-height:1.1;margin:6px 0 0\">Open questions<\u002Fh2><\u002Fdiv>\n  <ol style=\"margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px;text-wrap:pretty\">\n    <li><strong style=\"font-weight:600\">Checklist<\u002Fstrong> is the manual test checklist. It becomes an overlay opened by <code>t<\u002Fcode>, not a room. Room 4 becomes Retro (DIPO-453).<\u002Fli>\n    <li><strong style=\"font-weight:600\">Accepting a proposal<\u002Fstrong> files a Backlog draft through the planning lane. It doesn't go to Ready.<\u002Fli>\n    <li><strong style=\"font-weight:600\">Several offices:<\u002Fstrong> the header shows “+N elsewhere” from <code>office.summary<\u002Fcode>.<\u002Fli>\n    <li><strong style=\"font-weight:600\">Notifications<\u002Fstrong> already exist: the Mac posts one for each new desk item.<\u002Fli>\n    <li>The full gap report and the Ink migration plan are in the <a href=\"dipo Code Review.dc.html\">code review<\u002Fa>.<\u002Fli>\n  <\u002Fol>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;terminalTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;'dark'|'light'&quot;,&quot;section&quot;:&quot;Terminal mocks&quot;},&quot;palette&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;truecolor&quot;,&quot;ansi16&quot;],&quot;default&quot;:&quot;truecolor&quot;,&quot;tsType&quot;:&quot;'truecolor'|'ansi16'&quot;,&quot;section&quot;:&quot;Terminal mocks&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    const P = {\n      truecolor: {\n        dark:  { bg:'#1c1b19', fg:'#ddd8cf', hi:'#f6f2ea', dim:'#8f8a82', faint:'#3d3a35', acc:'#e1ad66', ok:'#a3c48e', err:'#e58b78', sel:'#2a2824', shade:'#4a4740' },\n        light: { bg:'#f6f4f1', fg:'#2d2b2b', hi:'#141312', dim:'#6e6a66', faint:'#d3cfca', acc:'#7d5411', ok:'#3f6b2f', err:'#a33a2b', sel:'#ebe6de', shade:'#c9c5c0' }\n      },\n      ansi16: {\n        dark:  { bg:'#0c0c0c', fg:'#cccccc', hi:'#ffffff', dim:'#808080', faint:'#4a4a4a', acc:'#d7af00', ok:'#5faf00', err:'#d75f5f', sel:'#262626', shade:'#3a3a3a' },\n        light: { bg:'#ffffff', fg:'#1a1a1a', hi:'#000000', dim:'#6c6c6c', faint:'#c6c6c6', acc:'#875f00', ok:'#2e7d00', err:'#af0000', sel:'#eeeeee', shade:'#cfcfcf' }\n      }\n    };\n    const pal = P[this.props.palette ?? 'truecolor'] || P.truecolor;\n    const t = pal[this.props.terminalTheme ?? 'dark'] || pal.dark;\n    return { t };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
