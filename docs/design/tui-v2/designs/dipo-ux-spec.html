  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

eight: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }\n.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }\n.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: transparent;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { color: var(--color-accent); box-shadow: inset 0 0 0 1px var(--color-accent); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: transparent; border: 1px solid var(--color-divider);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(-- al;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"b0b623fb-8dfb-444c-a7e2-814d9608fe38\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Lora';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"e24de5de-2e6b-4aca-9285-99e9dfbaf147\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Lora';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"bf734ed4-f451-408a-b9c9-7c4d6cd8790e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\nbody{margin:0;background:#f3f2f2;color:#201f1d;font-family:Lora,Georgia,serif;font-size:15px;line-height:1.55}\na{color:#7d5411;text-underline-offset:3px}\na:hover{color:#a06f24}\n*{box-sizing:border-box}\n::selection{background:rgba(182,130,53,.3)}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"--t-bg: {{ t.bg }}; --t-fg: {{ t.fg }}; --t-hi: {{ t.hi }}; --t-dim: {{ t.dim }}; --t-faint: {{ t.faint }}; --t-acc: {{ t.acc }}; --t-ok: {{ t.ok }}; --t-err: {{ t.err }}; --t-sel: {{ t.sel }}; --t-shade: {{ t.shade }}\">\n<div style=\"max-width:1260px;margin:0 auto;padding:64px 40px 120px;display:flex;flex-direction:column;gap:72px\">\n\n<header style=\"display:flex;flex-direction:column;gap:18px;border-bottom:1px solid rgba(32,31,29,.16);padding-bottom:40px\">\n  <div style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7d5411;font-variant-numeric:tabular-nums\">UX specification · v0.2 · 6 November 2026 · corrected against the code, see <a href=\"dipo Code Review.dc.html\">code review<\u002Fa><\u002Fdiv>\n  <h1 style=\"font-family:'Cormorant Garamond',serif;font-weight:400;font-size:64px;line-height:1.02;letter-spacing:-.02em;margin:0\">dipo, redesigned for the person<br>who only wants to be asked when it matters<\u002Fh1>\n  <p style=\"max-width:68ch;margin:0;font-size:17px;text-wrap:pretty\">dipo is the office manager. It takes prepared stories, starts AI developers in sealed boxes, has a reviewer check the result and merges it. You are the manager. This spec gives the terminal UI one job: <em>make your decisions obvious, and keep everything else quiet but reachable.<\u002Fem> It covers the diagnosis, the information architecture, the vocabulary, the keymap, six screens and the states around them, plus notes for building it in Ink.<\u002Fp>\n<\u002Fheader>\n\n<section style=\"display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:40px\">\n  <div><div style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7d5411\">§1<\u002Fdiv><h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;line-height:1.1;margin:6px 0 0\">What the current TUI gets wrong<\u002Fh2><\u002Fdiv>\n  <ol style=\"margin:0;padding-left:22px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px 40px;text-wrap:pretty\">\n    <li><strong style=\"font-weight:600\">Everything has the same weight.<\u002Fstrong> Headings, data, logs and key hints are all plain white text, so your eye has nowhere to land.<\u002Fli>\n    <li><strong style=\"font-weight:600\">Scheduler output under every screen.<\u002Fstrong> The “run next Ready story: done / skipped DIPO-448…” block is debug output. It shoves the real content around.<\u002Fli>\n    <li><strong style=\"font-weight:600\">Verbs repeated and inconsistent.<\u002Fstrong> <code>[y] accept [n] dismiss<\u002Fcode> is printed on every row. <code>P<\u002Fcode> parks but <code>p<\u002Fcode> opens privacy. Tab numbers appear on some screens and not others.<\u002Fli>\n    <li><strong style=\"font-weight:600\">Decisions get truncated.<\u002Fstrong> Story text and reviewer findings end in “…” and you can't read the rest. Those are exactly the words you need to judge.<\u002Fli>\n    <li><strong style=\"font-weight:600\">The status line is overloaded.<\u002Fstrong> Twelve facts share one wrapping line, from privacy flags to monthly tokens. Only “needs you” really matters.<\u002Fli>\n    <li><strong style=\"font-weight:600\">States overlap and repeat.<\u002Fstrong> DIPO-447 shows under both RUNNING and IN REVIEW. The same proposal appears twice on the desk.<\u002Fli>\n    <li><strong style=\"font-weight:600\">The run log is raw.<\u002Fstrong> A <code>[thinking]<\u002Fcode> line follows every tool call, bash one-liners wrap over three lines, and the agent's own sentences are buried.<\u002Fli>\n    <li><strong style=\"font-weight:600\">You can't tell what it does at a glance.<\u002Fstrong> No screen says what the team is doing right now or when it will next need you.<\u002Fli>\n  <\u002Fol>\n<\u002Fsection>\n\n<section style=\"display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:40px\">\n  <div><div style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7d5411\">§2<\u002Fdiv><h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;line-height:1.1;margin:6px 0 0\">Five principles<\u002Fh2><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0;border-top:1px solid rgba(32,31,29,.16)\">\n    <div style=\"padding:18px 20px 18px 0;border-bottom:1px solid rgba(32,31,29,.16)\"><div style=\"font-family:'Cormorant Garamond',serif;font-size:40px;line-height:1;color:#b68235;font-variant-numeric:tabular-nums\">1<\u002Fdiv><h4 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:21px;margin:8px 0 4px\">Needs-you first<\u002Fh4><p style=\"margin:0;font-size:14px;text-wrap:pretty\">The number that matters is how many decisions are waiting for you. It sits in the header of every screen, and dipo opens on the Desk whenever it's above zero.<\u002Fp><\u002Fdiv>\n    <div style=\"padding:18px 20px;border-bottom:1px solid rgba(32,31,29,.16)\"><div style=\"font-family:'Cormorant Garamond',serif;font-size:40px;line-height:1;color:#b68235;font-variant-numeric:tabular-nums\">2<\u002Fdiv><h4 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:21px;margin:8px 0 4px\">One verb, one key<\u002Fh4><p style=\"margin:0;font-size:14px;text-wrap:pretty\">A key means the same thing on every screen. The footer only shows the verbs for the item in focus.<\u002Fp><\u002Fdiv>\n    <div style=\"padding:18px 20px;border-bottom:1px solid rgba(32,31,29,.16)\"><div style=\"font-family:'Cormorant Garamond',serif;font-size:40px;line-height:1;color:#b68235;font-variant-numeric:tabular-nums\">3<\u002Fdiv><h4 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:21px;margin:8px 0 4px\">Quiet by default<\u002Fh4><p style=\"margin:0;font-size:14px;text-wrap:pretty\">Scheduler chatter shrinks to a one-line ticker. Totals live in Retro. A reason lives where you'd look for it: the Queue explains why a story waits.<\u002Fp><\u002Fdiv>\n    <div style=\"padding:18px 20px;border-bottom:1px solid rgba(32,31,29,.16)\"><div style=\"font-family:'Cormorant Garamond',serif;font-size:40px;line-height:1;color:#b68235;font-variant-numeric:tabular-nums\">4<\u002Fdiv><h4 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:21px;margin:8px 0 4px\">Show the pipeline<\u002Fh4><p style=\"margin:0;font-size:14px;text-wrap:pretty\">Every story sits somewhere on build, verify, review, merge. That line is drawn the same way wherever the story appears.<\u002Fp><\u002Fdiv>\n    <div style=\"padding:18px 0 18px 20px;border-bottom:1px solid rgba(32,31,29,.16)\"><div style=\"font-family:'Cormorant Garamond',serif;font-size:40px;line-height:1;color:#b68235;font-variant-numeric:tabular-nums\">5<\u002Fdiv><h4 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:21px;margin:8px 0 4px\">Never truncate a decision<\u002Fh4><p style=\"margin:0;font-size:14px;text-wrap:pretty\">Lists can use “…”. Anything you have to judge, like story text and findings, wraps in full in a preview or reader pane.<\u002Fp><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:40px\">\n  <div><div style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7d5411\">§3<\u002Fdiv><h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;line-height:1.1;margin:6px 0 0\">Information architecture<\u002Fh2><p style=\"font-size:14px;margin:12px 0 0;text-wrap:pretty\">Three levels and four rooms. Drill down with ⏎ and climb back with esc. Overlays sit above every level.<\u002Fp><\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:22px\">\n    <div style=\"display:flex;flex-wrap:wrap;align-items:stretch;gap:14px;font-family:'JetBrains Mono',monospace;font-size:13px\">\n      <div style=\"border:1px solid #b68235;border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:150px\"><span style=\"color:#7d5411\">o<\u002Fspan><strong style=\"font-weight:600\">Offices<\u002Fstrong><span style=\"color:#605d5d\">one per product repo<\u002Fspan><\u002Fdiv>\n      <div style=\"align-self:center;color:#9b9797\">→<\u002Fdiv>\n      <div style=\"border:1px solid #b68235;border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;flex:1 1 360px\">\n        <div><strong style=\"font-weight:600\">Office<\u002Fstrong> <span style=\"color:#605d5d\">· four rooms, 1–4<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px\">\n          <div style=\"border:1px solid rgba(32,31,29,.16);border-radius:2px;padding:8px\"><span style=\"color:#7d5411\">1<\u002Fspan> Desk<div style=\"color:#605d5d;font-size:12px\">needs you<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid rgba(32,31,29,.16);border-radius:2px;padding:8px\"><span style=\"color:#7d5411\">2<\u002Fspan> Floor<div style=\"color:#605d5d;font-size:12px\">running, in review<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid rgba(32,31,29,.16);border-radius:2px;padding:8px\"><span style=\"color:#7d5411\">3<\u002Fspan> Queue<div style=\"color:#605d5d;font-size:12px\">ready, waiting<\u002Fdiv><\u002Fdiv>\n          <div style=\"border:1px solid rgba(32,31,29,.16);border-radius:2px;padding:8px\"><span style=\"color:#7d5411\">4<\u002Fspan> Retro<div style=\"color:#605d5d;font-size:12px\">done, cost, rework<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"align-self:center;color:#9b9797\">→<\u002Fdiv>\n      <div style=\"border:1px solid #b68235;border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:150px\"><span style=\"color:#7d5411\">⏎<\u002Fspan><strong style=\"font-weight:600\">Story<\u002Fstrong><span style=\"color:#605d5d\">story · criteria · reviews · runs<\u002Fspan><\u002Fdiv>\n      <div style=\"align-self:center;color:#9b9797\">→<\u002Fdiv>\n      <div style=\"border:1px solid #b68235;border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:150px\"><span style=\"color:#7d5411\">⏎<\u002Fspan><strong style=\"font-weight:600\">Run<\u002Fstrong><span style=\"color:#605d5d\">live stream, steer, park<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px 28px;font-size:14px;color:#444141;border-top:1px solid rgba(32,31,29,.16);padding-top:14px\">\n      <span><code style=\"color:#7d5411\">:<\u002Fcode> or <code style=\"color:#7d5411\">ctrl-k<\u002Fcode>: command palette, everything is reachable here<\u002Fspan>\n      <span><code style=\"color:#7d5411\">?<\u002Fcode>: every key for this screen<\u002Fspan>\n      <span><code style=\"color:#7d5411\">/<\u002Fcode>: filter the list in focus<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"margin:0;font-size:14px;max-width:72ch;text-wrap:pretty\"><strong style=\"font-weight:600\">Launch rule.<\u002Fstrong> Inside a repo, <code>dipo<\u002Fcode> opens that office. It lands on the Desk if anything needs you, otherwise on the Floor. Outside a repo it opens Offices. Quitting the TUI never stops the daemon, and the first quit of a session says so once.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:40px\">\n  <div><div style=\"font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7d5411\">§4<\u002Fdiv><h2 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:34px;line-height:1.1;margin:6px 0 0\">Vocabulary<\u002Fh2><p style=\"font-size:14px;margin:12px 0 0;text-wrap:pretty\">Keep the office metaphor and make it consistent. Every word is a place or a person.<\u002Fp><\u002Fdiv>\n  <div style=\"overflow-x:auto\">\n  <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:14px\">\n    <sc-raw-thead><sc-raw-tr style=\"text-align:left;border-bottom:1px solid #b68235\"><sc-raw-th style=\"font-weight:600;padding:8px 16px 8px 0\">Today<\u002Fsc-raw-th><sc-raw-th style=\"font-weight:600;padding:8px 16px 8px 0\">Becomes<\u002Fsc-raw-th><sc-raw-th style=\"font-weight:600;padding:8px 0\">Why<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-raw-tr style=\"border-bottom:1px solid rgba(32,31,29,.16)\"><sc-raw-td style=\"padding:9px 16px 9px 0;font-family:'JetBrains Mono',monospace;font-size:12.5px\">[1] overview<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 16px 9px 0\">Floor<\u002Fsc-raw-td><sc-raw-td style=\"padding:9px 0\">The place where work happens. “O iv>\n            <div style=\"display:flex\"><span style=\"width:2ch\"> <\u002Fspan><span style=\"color:var(--t-err);width:2ch\">✗<\u002Fspan><span style=\"flex:1\">DIPO-447 budget reached<\u002Fspan><span style=\"color:var(--t-dim)\">31m  <\u002Fspan><\u002Fdiv>\n            <div style=\"color:var(--t-dim)\">    blocks 3<\u002Fdiv>\n            <div> <\u002Fdiv>\n            <div style=\"color:var(--t-dim)\">PROPOSAL<\u002Fdiv>\n            <div style=\"display:flex\"><span style=\"width:2ch\"> <\u002Fspan><span style=\"color:var(--t-acc);width:2ch\">◆<\u002Fspan><span style=\"flex:1\">CLI verbs for planning<\u002Fspan><span style=\"color:var(--t-dim)\">2h  <\u002Fspan><\u002Fdiv>\n            <div> <\u002Fdiv>\n            <div style=\"color:var(--t-dim)\">NEXT UP<\u002Fdiv>\n            <div style=\"display:flex\"><span style=\"width:2ch\"> <\u002Fspan><span style=\"color:var(--t-ok);width:2ch\">→<\u002Fspan><span style=\"flex:1\">DIPO-452 triage drafts<\u002Fspan><span style=\"color:var(--t-dim)\">slot  <\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;border-left:1px solid var(--t-faint);padding-left:2ch;display:flex;flex-direction:column\">\n            <div style=\"color:var(--t-dim)\">MERGE · waits for you<\u002Fdiv>\n            <div style=\"color:var(--t-hi);font-weight:600\">DIPO-446 Planning tools for workers<\u002Fdiv>\n            <div><span style=\"color:var(--t-ok)\">setup ━━ build ✓ ━━ review ✓ ━━ <\u002Fspan><span style=\"color:var(--t-acc)\">● test <\u002Fspan><span style=\"color:var(--t-faint)\">┄┄ merge<\u002Fspan><\u002Fdiv>\n            <div> <\u002Fdiv>\n            <div><span style=\"color:var(--t-dim)\">Why     <\u002Fspan>you flagged it test-before-merge<\u002Fdiv>\n            <div><span style=\"color:var(--t-dim)\">Review  <\u002Fspan><span style=\"color:var(--t-ok)\">approved<\u002Fspan> round 1 · 8/8 criteria<\u002Fdiv>\n            <div><span style=\"color:var(--t-dim)\">CI      <\u002Fspan><span style=\"color:var(--t-ok)\">✓<\u002Fspan> 4 required checks green<\u002Fdiv>\n            <div><span style=\"color:var(--t-dim)\">Change  <\u002Fspan>6 files · +214 −38<\u002Fdiv>\n            <div><span style=\"color:var(--t-dim)\">Blocks  <\u002Fspan>DIPO-448 · DIPO-449<\u002Fdiv>\n            <div><span style=\"color:var(--t-dim)\">Tests   <\u002Fspan>3 manual steps<\u002Fdiv>\n            <div> <\u002Fdiv>\n            <div> <\u002Fdiv>\n            <div style=\"display:flex;gap:2ch\"><span style=\"border:1px solid var(--t-acc);padding:0 1ch\"><span style=\"color:var(--t-acc)\">t<\u002Fspan> Test first<\u002Fspan><span style=\"border:1px solid var(--t-faint);padding:0 1ch\"><span style=\"color:var(--t-acc)\">y<\u002Fspan> Approve<\u002Fspan><span style=\"border:1px solid var(--t-faint);padding:0 1ch\"><span style=\"color:var(--t-acc)\">n<\u002Fspan> Reject…<\u002Fspan><span style=\"border:1px solid var(--t-faint);padding:0 1ch\"><span style=\"color:var(--t-acc)\">o<\u002Fspan> PR<\u002Fspan><\u002Fdiv>\n            <div> <\u002Fdiv>\n            <div style=\"color:var(--t-dim)\">Approve merges once the checks pass on the close-out head.<\u002Fdiv>\n            <div style=\"color:var(--t-dim)\">$ dipo approve DIPO-446<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"color:var(--t-dim)\">13:04 DIPO-447 parked budget-exceeded  ·  12:58 review approved DIPO-446<\u002Fdiv>\n        <div style=\"height:1.55em;background:linear-gradient(var(--t-faint),var(--t-faint)) center/100% 1px no-repeat\"><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between\"><span style=\"display:flex;gap:3ch\"><span><span style=\"color:var(--t-acc)\">↑↓<\u002Fspan> move<\u002Fspan><span><span style=\"color:var(--t-acc)\">t<\u002Fspan> test<\u002Fspan><span><span style=\"color:var(--t-acc)\">y<\u002Fspan> approve<\u002Fspan><span><span style=\"color:var(--t-acc)\">n<\u002Fspan> reject<\u002Fspan><span><span style=\"color:var(--t-acc)\">⏎<\u002Fspan> open story<\u002Fspan><\u002Fspan><span style=\"display:flex;gap:3ch;color:var(--t-dim)\"><span><span style=\"color:var(--t-acc)\">:<\u002Fspan> commands<\u002Fspan><span><span style=\"color:var(--t-acc)\">?<\u002Fspan> keys<\u002Fspan><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <ol style=\"flex:1 1 260px;margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:10px;text-wrap:pretty\">\n      <li><strong style=\"font-weight:600\">The engine sets the order.<\u002Fstrong> Groups follow <code>KNOWN_DESK_KINDS<\u002Fcode>. Within a group, the most-blocking item comes first, then the oldest. The TUI never re-sorts.<\u002Fli>\n      <li><strong style=\"font-weight:600\">One glyph per kind<\u002Fstrong>: <code>!<\u002Fcode> paused, <code>?<\u002Fcode> question, <code>○<\u002Fcode> waiting gate, <code>✗<\u002Fcode> parked, <code>◆<\u002Fcode> proposal, <code>→<\u002Fcode> next up. They stay readable under NO_COLOR.<\u002Fli>\n      <li><strong style=\"font-weight:600\">The second row is the reason.<\u002Fstrong> It shows why the item waits, plus <code>blocks N<\u002Fcode> when it holds others up.<\u002Fli>\n      <li><strong style=\"font-weight:600\">The preview is built from <code>DeskItem<\u002Fcode><\u002Fstrong>: <code>detail<\u002Fcode>, <code>blocks<\u002Fcode>, <code>since<\u002Fcode>, <code>hand<\u002Fcode> and <code>actions<\u002Fcode>. Buttons are the bound actions. The dim last line is the engine's <code>cli<\u002Fcode>, so the TUI teaches the CLI.<\u002Fli>\n      <li><strong style=\"font-weight:600\">Each verb has one key.<\u002Fstrong> Here <code>y<\u002Fcode> means approve because that's what this item asks. On a proposal it means accept.<\u002Fli>\n    <\u002Fol>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s1c\" style=\"display:flex;flex-direction:column;gap:18px\">\n  <div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid rgba(32,31,29,.16);padding-bottom:10px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;border:1px solid #b68235;color:#7d5411;padding:2px 8px;border-radius:2px\">S1c<\u002Fspan><h3 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:28px;margin:0\">Desk previews, by kind<\u002Fh3><span style=\"color:#605d5d;font-size:14px\">the right pane only · with the inline prompt open where one applies<\u002Fspan><\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,66ch),1fr));gap:24px;font-family:'JetBrains Mono',monospace;font-size:12.5px\">\n\n    <figure style=\"margin:0;display:flex;flex-direction:column;gap:8px\">\n      <div style=\"border:1px solid rgba(32,31,29,.2);border-radius:4px;overflow-x:auto\"><div style=\"white-space:pre;display:flex;flex-direction:column;line-height:1.55;background:var(--t-bg,#1c1b19);color:var(--t-fg,#e9e5de);padding:1.2em 2ch;min-height:24em\">\n        <div style=\"color:var(--t-dim)\">QUESTION · worker waiting 12m · build, loop 2<\u002Fdiv>\n        <div style=\"color:var(--t-hi);font-weight:600\">DIPO-450 Should filed stories keep their ordinal?<\u002Fdiv>\n        <div> <\u002Fdiv>\n        <div style=\"white-space:pre-wrap;max-width:60ch\">“The session confirms three stories. Backlog.md gives drafts a new ordinal on promote. Should I keep the ordinal the session showed, or let Backlog assign it?”<\u002Fdiv>\n        <div> <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;border:1px solid var(--t-acc);padding:.3em 1ch\">\n          <div style=\"color:var(--t-dim)\">answer<\u002Fdiv>\n          <div style=\"color:var(--t-hi)\">Keep the session's order. Only new drafts<\u002Fdiv>\n          <div style=\"color:var(--t-hi)\">get a fresh ordinal.<span style=\"color:var(--t-acc)\">▍<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"color:var(--t-dim)\"><span style=\"color:var(--t-acc)\">⏎<\u002Fspan> new line   <span style=\"color:var(--t-acc)\">ctrl-s<\u002Fspan> send   <span style=\"color:var(--t-acc)\">esc<\u002Fspan> cancel<\u002Fdiv>\n        <div> <\u002Fdiv>\n        <div style=\"color:var(--t-dim)\">The worker gets it on resume, and the run continues.<\u002Fdiv>\n        <div style=\"color:var(--t-dim)\">$ dipo answer q_7f2c \"…\"<\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n      <figcaption style=\"font-family:Lora,serif;font-size:13px;color:#605d5d\">Pressing <code>a<\u002Fcode> opens the multi-line input (the <code>&lt;Composer&gt;<\u002Fcode> from step 1) under the worker's question. That's the same input as steer, reject notes and DIPO-449.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <figure style=\"margin:0;display:flex;flex-direction:column;gap:8px\">\n      <div style=\"border:1px solid rgba(32,31,29,.2);border-radius:4px;overflow-x:auto\"><div style=\"white-space:pre;display:flex;flex-direction:column;line-height:1.55;background:var(--t-bg,#1c1b19);color:var(--t-fg,#e9e5de);padding:1.2em 2ch;min-height:24em\">\n        <div style=\"color:var(--t-dim)\">PARKED · budget-exceeded · 31m · blocks 3<\u002Fdiv>\n        <div style=\"color:var(--t-hi);font-weight:600\">DIPO-447 paused: token budget reached<\u002Fdiv>\n        <div style=\"color:var(--t-dim)\">Used 2.0M of 2.0M · loop 6 of 8 · criteria 8/10<\u002Fdiv>\n        <div style=\"color:var(--t-dim)\">Last said: “Two flaky shards left, fixing reattach.”<\u002Fdiv>\n        <div> <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;border:1px solid var(--t-acc);padding:.3em 1ch\">\n          <div><span style=\"color:var(--t-dim)\">top up  <\u002Fspan><span style=\"color:var(--t-dim)\"> +25% <\u002Fspan> <span style=\"color:var(--t-hi);border:1px solid var(--t-acc)\"> +50% <\u002Fspan> <span style=\"color:var(--t-dim)\"> +100% <\u002Fspan><span style=\"color:var(--t-dim)\">   ←→<\u002Fspan><\u002Fdiv>\n          <div><span style=\"color:var(--t-dim)\">caps    <\u002Fspan>2.0M → <span style=\"color:var(--t-hi)\">3.0M<\u002Fspan> tokens · 400 → <span style=\"color:var(--t-hi)\">600<\u002Fspan> turns<\u002Fdiv>\n          <div><span style=\"color:var(--t-dim)\">note    <\u002Fspan><span style=\"color:var(--t-hi)\">Only the two reattach shards.<\u002Fspan><span style=\"color:var(--t-acc)\">▍<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"color:var(--t-dim)\"><span style=\"color:var(--t-acc)\">ctrl-s<\u002Fspan> resume   <span style=\"color:var(--t-acc)\">tab<\u002Fspan> field   <span style=\"color:var(--t-acc)\">esc<\u002Fspan> cancel<\u002Fdiv>\n        <div> <\u002Fdiv>\n        <div style=\"color:var(--t-dim)\">A fresh session starts with a handoff. The box and branch are kept.<\u002Fdiv>\n        <div style=\"color:var(--t-dim)\">$ dipo resume DIPO-447 --budget 50% --note \"…\"<\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n      <figcaption style=\"font-family:Lora,serif;font-size:13px;color:#605d5d\">Pressing <code>r<\u002Fcode> asks only for what the park reason needs (table below). Here that's a top-up, with caps before → after taken from <code>ResumeConfirmDetails<\u002Fcode>. Seeing them is the confirmation, so there's no separate yes/no step.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <figure style=\"margin:0;display:flex;flex-direction:column;gap:8px\">\n      <div style=\"border:1px solid rgba(32,31,29,.2);border-radius:4px;overflow-x:auto\"><div style=\"white-space:pre;display:flex;flex-direction:column;line-height:1.55;background:var(--t-bg,#1c1b19);color:var(--t-fg,#e9e5de);padding:1.2em 2ch;min-height:24em\">\n        <div style=\"color:var(--t-dim)\">NEXT UP · run slot 2 of 3 is free<\u002Fdiv>\n        <div style=\"color:var(--t-hi);font-weight:600\">DIPO-452 File every incoming idea as a draft<\u002Fdiv>\n        <div> <\u002Fdiv>\n        <div><span style=\"color:var(--t-dim)\">Why     <\u002Fspan>first Ready story whose dependencies are Done<\u002Fdiv>\n        <div><span style=\"color:var(--t-dim)\">Tier    <\u002Fspan>M · opus-5.5 · 2.0M tokens · 8 loops<\u002Fdiv>\n        <div><span style=\"color:var(--t-dim)\">Shares  <\u002Fspan><span style=\"color:var(--t-acc)\">!<\u002Fspan> engine/src/backlog/drafts.ts<\u002Fdiv>\n        <div><span style=\"color:var(--t-dim)\">        <\u002Fspan>with DIPO-447 (parked)<\u002Fdiv>\n        <div> <\u002Fdiv>\n        <div> <\u002Fdiv>\n        <div style=\"display:flex;gap:2ch\"><span style=\"border:1px solid var(--t-acc);padding:0 1ch\"><span style=\"color:var(--t-acc)\">y<\u002Fspan> Start it<\u002Fspan><span style=\"border:1px solid var(--t-faint);padding:0 1ch\"><span style=\"color:var(--t-acc)\">n<\u002Fspan> Offer the next one<\u002Fspan><\u002Fdiv>\n        <div> <\u002Fdiv>\n        <div style=\"color:var(--t-dim)\">Nothing starts until you confirm. Declined stories return<\u002Fdiv>\n        <div style=\"color:var(--t-dim)\">once their task file changes.<\u002Fdiv>\n        <div style=\"color:var(--t-dim)\">$ dipo next confirm DIPO-452<\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n      <figcaption style=\"font-family:Lora,serif;font-size:13px;color:#605d5d\">Shared files get a <code>!<\u002Fcode> because overlap is the thing that makes parallel runs expensive. The decline rule is spelled out so <code>n<\u002Fcode> doesn't feel like a permanent no.<\u002Ffigcaption>\n    <\u002Ffigure>\n\n    <figure style=\"margin:0;display:flex;flex-direction:column;gap:8px\">\n      <div style=\"border:1px solid rgba(32,31,29,.2);border-radius:4px;overflow-x:auto\"><div style=\"white-space:pre;display:flex;flex-direction:column;line-height:1.55;background:var(--t-bg,#1c1b19);color:var(--t-fg,#e9e5de);padding:1.2em 2ch;min-height:24em\">\n        <div style=\"color:var(--t-dim)\">STARTS PAUSED · whole office · since 12:40<\u002Fdiv>\n        <div style=\"color:var(--t-hi);font-weight:600\">No new sessions start in this office<\u002Fdiv>\n        <div> <\u002Fdiv>\n        <div><span style=\"color:var(--t-dim)\">Reason  <\u002Fspan>Claude plan limit reached<\u002Fdiv>\n        <div><span style=\"color:var(--t-dim)\">Lifts   <\u002Fspan>by itself, expected ~14:00<\u002Fdiv>\n        <div><span style=\"color:var(--t-dim)\">Running <\u002Fspan>DIPO-446 waits for you, unaffected<\u002Fdiv>\n        <div><span style=\"color:var(--t-dim)\">Parked  <\u002Fspan>sessions that hit the limit resume<\u002Fdiv>\n        <div><span style=\"color:var(--t-dim)\">        <\u002Fspan>on their own when it lifts<\u002Fdiv>\n        <div> <\u002Fdiv>\n        <div style=\"color:var(--t-ok)\">✓ Nothing to do. Look away until ~14:00.<\u002Fdiv>\n        <div> <\u002Fdiv>\n        <div style=\"color:var(--t-dim)\">Lift it early, only if you raised your plan:<\u002Fdiv>\n        <div style=\"color:var(--t-dim)\">$ dipo daemon resume-starts<\u002Fdiv>\n      <\u002Fdiv><\u002Fdiv>\n      <figcaption style=\"font-family:Lora,serif;font-size:13px;color:#605d5d\">An item with nothing to do says so first. The early lift isn't bound to a key, because it's rare and the cause is outside dipo. A box-token pause shows <code>hand<\u002Fcode> instead: “Run <code>dipo login box<\u002Fcode> in a shell.”<\u002Ffigcaption>\n    <\u002Ffigure>\n  <\u002Fdiv>\n\n  <div style=\"display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:40px;margin-top:12px\">\n    <div><h4 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:21px;margin:0\">What <code>r<\u002Fcode> asks for<\u002Fh4><p style=\"font-size:14px;margin:8px 0 0;color:#605d5d;text-wrap:pretty\">This comes from the 0020 park table. The prompt only shows the fields the reason requires.<\u002Fp><\u002Fdiv>\n    <div style=\"overflow-x:auto\">\n    <sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13.5px\">\n      <sc-raw-thead><sc-raw-tr style=\"text-align:left;border-bottom:1px solid #b68235\"><sc-raw-th style=\"font-weight:600;padding:7px 14px 7px 0\">Reason<\u002Fsc-raw-th><sc-raw-th style=\"font-weight:600;padding:7px 14px 7px 0\">Prompt<\u002Fsc-raw-th><sc-raw-th style=\"font-weight:600;padding:7px 0\">Other keys<\u002Fsc- ;flex-direction:column\">\n          <div style=\"color:var(--t-dim)\">SETUP<\u002Fdiv>\n          <div style=\"display:flex\"><span style=\"width:2ch\"> <\u002Fspan><span style=\"color:var(--t-err);width:2ch\">✗<\u002Fspan><span style=\"flex:1\">dev profile unresolved, blocks every story<\u002Fspan><span style=\"color:var(--t-dim)\">1h<\u002Fspan><\u002Fdiv>\n          <div> <\u002Fdiv>\n          <div style=\"color:var(--t-dim)\">PROPOSALS<\u002Fdiv>\n          <div style=\"display:flex;background:var(--t-sel)\"><span style=\"width:2ch;color:var(--t-acc)\">▌<\u002Fspan><span style=\"color:var(--t-acc);width:2ch\">◆<\u002Fspan><span style=\"flex:1;color:var(--t-hi)\">CLI verbs for the planning session<\u002Fspan><span style=\"color:var(--t-dim)\">7m<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;background:var(--t-sel);color:var(--t-dim)\"><span style=\"width:4ch\"> <\u002Fspan><span>DIPO-447 · blocks 448 449 450<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;margin-top:.35em\"><span style=\"width:2ch\"> <\u002Fspan><span style=\"color:var(--t-acc);width:2ch\">◆<\u002Fspan><span style=\"flex:1\">Show open session in snapshot  <span style=\"color:var(--t-dim)\">×2<\u002Fspan><\u002Fspan><span style=\"color:var(--t-dim)\">3m<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;margin-top:.35em\"><span style=\"width:2ch\"> <\u002Fspan><span style=\"color:var(--t-acc);width:2ch\">◆<\u002Fspan><span style=\"flex:1\">Claude Code minimum from flags<\u002Fspan><span style=\"color:var(--t-dim)\">34m<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height:1.55em;background:linear-gradient(var(--t-faint),var(--t-faint)) center/100% 1px no-repeat\"><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between\"><span style=\"display:flex;gap:2ch\"><span><span style=\"color:var(--t-acc)\">y<\u002Fspan> accept<\u002Fspan><span><span style=\"color:var(--t-acc)\">n<\u002Fspan> dismiss<\u002Fspan><span><span style=\"color:var(--t-acc)\">⏎<\u002Fspan> read<\u002Fspan><\u002Fspan><span style=\"color:var(--t-dim)\"><span style=\"color:var(--t-acc)\">?<\u002Fspan> keys<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 260px;font-size:14px;display:flex;flex-direction:column;gap:10px;text-wrap:pretty\">\n      <h4 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:21px;margin:0\">At 80 × 24<\u002Fh4>\n      <p style=\"margin:0\">Below 100 columns the preview pane goes away and ⏎ opens it full screen. Each list row keeps its most important secondary line. The ticker and the “Since” line drop out. The header shortens the office name before it drops the daemon dot.<\u002Fp>\n      <p style=\"margin:0\">Below 60 columns dipo shows <em>“Widen the terminal to at least 60 columns”<\u002Fem> instead of a broken layout.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"s7\" style=\"display:flex;flex-direction:column;gap:18px\"><div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid rgba(32,31,29,.16);padding-bottom:10px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;border:1px solid #b68235;color:#7d5411;padding:2px 8px;border-radius:2px\">S7<\u002Fspan><h3 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:28px;margin:0\">Interactions<\u002Fh3><span style=\"color:#605d5d;font-size:14px\">steer · confirmations · pending and retry<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,62ch),1fr));gap:24px;font-family:'JetBrains Mono',monospace;font-size:12.5px\"><figure style=\"margin:0;display:flex;flex-direction:column;gap:8px\"><div style=\"border:1px solid rgba(32,31,29,.2);border-radius:4px;overflow-x:auto\"><div style=\"white-space:pre;display:flex;flex-direction:column;line-height:1.55;background:var(--t-bg,#1c1b19);color:var(--t-fg,#e9e5de);padding:1.2em 2ch;min-height:22em\"><div style=\"color:var(--t-dim)\">10:40  read   engine/src/box/review-box.ts<\u002Fdiv><div style=\"color:var(--t-dim)\">10:41  ··     2 thoughts · 0.6k tokens<\u002Fdiv><div><span style=\"color:var(--t-dim)\">10:41  <\u002Fspan><span style=\"color:var(--t-acc)\">says   <\u002Fspan><span style=\"color:var(--t-hi)\">Fixing the reattach shard timeout next.<\u002Fspan><\u002Fdiv><div style=\"color:var(--t-dim)\">10:41  bash   bun test reattach.test.ts<\u002Fdiv><div> <\u002Fdiv><div style=\"display:flex;flex-direction:column;border:1px solid var(--t-acc);padding:.3em 1ch\"><div style=\"color:var(--t-dim)\">steer DIPO-447 · arrives at its next turn<\u002Fdiv><div style=\"color:var(--t-hi)\">Don’t raise the timeout. The real host must<\u002Fdiv><div style=\"color:var(--t-hi)\">bind within 4.5 s; find why it doesn’t.<span style=\"color:var(--t-acc)\">▍<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"color:var(--t-dim)\"><span style=\"color:var(--t-acc)\">⏎<\u002Fspan> new line   <span style=\"color:var(--t-acc)\">ctrl-s<\u002Fspan> send   <span style=\"color:var(--t-acc)\">esc<\u002Fspan> cancel<\u002Fdiv><div> <\u002Fdiv><div><span style=\"color:var(--t-dim)\">10:42  <\u002Fspan><span style=\"color:var(--t-ok)\">you    <\u002Fspan><span>Don’t raise the timeout… <span style=\"color:var(--t-dim)\">· delivered next turn<\u002Fspan><\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><figcaption style=\"font-family:Lora,serif;font-size:13px;color:#605d5d;text-wrap:pretty\"><code>s<\u002Fcode> on a running story opens the input at the foot of the stream, so the context stays visible above it. Once sent, your message lands <em>in<\u002Fem> the stream as a <code>you<\u002Fcode> line, and its delivery state comes from the reply (<code>next-turn<\u002Fcode> or <code>on-resume<\u002Fcode>). A reviewer session answers “Not steerable: the reviewer is working” instead.<\u002Ffigcaption><\u002Ffigure><figure style=\"margin:0;display:flex;flex-direction:column;gap:8px\"><div style=\"border:1px solid rgba(32,31,29,.2);border-radius:4px;overflow-x:auto\"><div style=\"white-space:pre;display:flex;flex-direction:column;line-height:1.55;background:var(--t-bg,#1c1b19);color:var(--t-fg,#e9e5de);padding:1.2em 2ch;min-height:22em\"><div style=\"color:var(--t-dim)\">PROPOSAL<\u002Fdiv><div style=\"display:flex;background:var(--t-sel)\"><span style=\"width:2ch;color:var(--t-acc)\">▌<\u002Fspan><span style=\"color:var(--t-dim);width:2ch\">◌<\u002Fspan><span style=\"flex:1;color:var(--t-dim)\">CLI verbs for planning<\u002Fspan><span style=\"color:var(--t-dim)\">accepting…<\u002Fspan><\u002Fdiv><div> <\u002Fdiv><div style=\"color:var(--t-dim)\">then, when the stream passes the reply cursor:<\u002Fdiv><div style=\"display:flex\"><span style=\"width:2ch\"> <\u002Fspan><span style=\"color:var(--t-ok);width:2ch\">✓<\u002Fspan><span style=\"flex:1\">accepted · draft-31 in backlog PR #612<\u002Fspan><span style=\"color:var(--t-dim)\"><span style=\"color:var(--t-acc)\">u<\u002Fspan> undo<\u002Fspan><\u002Fdiv><div> <\u002Fdiv><div style=\"color:var(--t-dim)\">or, when it fails:<\u002Fdiv><div style=\"display:flex\"><span style=\"width:2ch\"> <\u002Fspan><span style=\"color:var(--t-err);width:2ch\">✗<\u002Fspan><span style=\"flex:1\">accept failed: lane.waiting · no remote<\u002Fspan><\u002Fdiv><div style=\"display:flex\"><span style=\"width:4ch\"> <\u002Fspan><span style=\"color:var(--t-dim)\">push access to origin failed · <\u002Fspan><span style=\"color:var(--t-acc)\">^R<\u002Fspan><span style=\"color:var(--t-dim)\"> retry<\u002Fspan><\u002Fdiv><div style=\"height:1.55em;background:linear-gradient(var(--t-faint),var(--t-faint)) center/100% 1px no-repeat\"><\u002Fdiv><div style=\"color:var(--t-dim)\">footer: ^R retry · ↑↓ move · y accept · n dismiss<\u002Fdiv><\u002Fdiv><\u002Fdiv><figcaption style=\"font-family:Lora,serif;font-size:13px;color:#605d5d;text-wrap:pretty\">Current behaviour is that an action counts as done only once the stream passes its reply cursor (read-your-writes). The row shows that: <code>◌<\u002Fcode> while pending, then the result in place. <code>^R<\u002Fcode> resends with the same request id. The row stays where it is until resolved, so focus never jumps out from under you.<\u002Ffigcaption><\u002Ffigure><figure style=\"margin:0;display:flex;flex-direction:column;gap:8px\"><div style=\"border:1px solid rgba(32,31,29,.2);border-radius:4px;overflow-x:auto\"><div style=\"white-space:pre;display:flex;flex-direction:column;line-height:1.55;background:var(--t-bg,#1c1b19);color:var(--t-fg,#e9e5de);padding:1.2em 2ch;min-height:22em\"><div style=\"display:flex;flex-direction:column;border:1px solid var(--t-err);padding:.5em 2ch\"><div><span style=\"color:var(--t-err)\">✗ <\u002Fspan><span style=\"color:var(--t-hi);font-weight:600\">Discard DIPO-447?<\u002Fspan><\u002Fdiv><div> <\u002Fdiv><div>This ends the run, deletes the branch and<\u002Fdiv><div>returns the story to Refined. It can’t be undone.<\u002Fdiv><div> <\u002Fdiv><div style=\"color:var(--t-dim)\">Lost: 3 commits not on main<\u002Fdiv><div><span style=\"color:var(--t-dim)\">  a1f9e20 <\u002Fspan>Read-only planning box<\u002Fdiv><div><span style=\"color:var(--t-dim)\">  7c03b5d <\u002Fspan>Turn-by-turn session protocol<\u002Fdiv><div><span style=\"color:var(--t-dim)\">  e88d412 <\u002Fspan>Bypass tests for the planner role<\u002Fdiv><div> <\u002Fdiv><div><span style=\"color:var(--t-dim)\">note  <\u002Fspan>Wrong approach, replan as two stories<\u002Fdiv><div><span style=\"color:var(--t-dim)\">type  <\u002Fspan><span style=\"color:var(--t-hi)\">DIPO-44<\u002Fspan><span style=\"color:var(--t-acc)\">▍<\u002Fspan><span style=\"color:var(--t-dim)\">   to confirm<\u002Fspan><\u002Fdiv><\u002Fdiv><div style=\"color:var(--t-dim)\"><span style=\"color:var(--t-acc)\">⏎<\u002Fspan> discard (when the id matches)   <span style=\"color:var(--t-acc)\">esc<\u002Fspan> keep it<\u002Fdiv><\u002Fdiv><\u002Fdiv><figcaption style=\"font-family:Lora,serif;font-size:13px;color:#605d5d;text-wrap:pretty\"><code>D<\u002Fcode> is the only red-bordered prompt. It lists exactly what <code>story.losses<\u002Fcode> says will be lost, needs the note the command requires, and asks for the id typed out (ADR 0009). The ⏎ hint stays dim until the id matches.<\u002Ffigcaption><\u002Ffigure><figure style=\"margin:0;display:flex;flex-direction:column;gap:8px\"><div style=\"border:1px solid rgba(32,31,29,.2);border-radius:4px;overflow-x:auto\"><div style=\"white-space:pre;display:flex;flex-direction:column;line-height:1.55;background:var(--t-bg,#1c1b19);color:var(--t-fg,#e9e5de);padding:1.2em 2ch;min-height:22em\"><div style=\"display:flex;flex-direction:column;border:1px solid var(--t-acc);padding:.5em 2ch\"><div><span style=\"color:var(--t-acc)\">! <\u002Fspan><span style=\"color:var(--t-hi);font-weight:600\">Drop DIPO-288 from the backlog?<\u002Fspan><\u002Fdiv><div> <\u002Fdiv><div>Archives the story and releases its claim.<\u002Fdiv><div> <\u002Fdiv><div><span style=\"color:var(--t-acc)\">[ ]<\u002Fspan> also delete its branch <span style=\"color:var(--t-dim)\">(space)<\u002Fspan><\u002Fdiv><div style=\"color:var(--t-dim)\">    keeps 1 commit if left unticked<\u002Fdiv><div> <\u002Fdiv><\u002Fdiv><div style=\"color:var(--t-dim)\"><span style=\"color:var(--t-acc)\">y<\u002Fspan> drop   <span style=\"color:var(--t-acc)\">space<\u002Fspan> toggle branch   <span style=\"color:var(--t-acc)\">esc<\u002Fspan> keep it<\u002Fdiv><div> <\u002Fdiv><div style=\"color:var(--t-dim)\">Ticking the box turns the border red and asks for the id, like discard.<\u002Fdiv><\u002Fdiv><\u002Fdiv><figcaption style=\"font-family:Lora,serif;font-size:13px;color:#605d5d;text-wrap:pretty\">Drop is reversible unless you delete the branch (<code>irreversibleWhen: deleteBranch<\u002Fcode>), so the prompt escalates only when you tick it. One prompt, two levels of risk, never a surprise.<\u002Ffigcaption><\u002Ffigure><\u002Fdiv><\u002Fsection>\n\n<section id=\"s8\" style=\"display:flex;flex-direction:column;gap:18px\"><div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid rgba(32,31,29,.16);padding-bottom:10px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;border:1px solid #b68235;color:#7d5411;padding:2px 8px;border-radius:2px\">S8<\u002Fspan><h3 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:28px;margin:0\">When the daemon is away<\u002Fh3><span style=\"color:#605d5d;font-size:14px\">offline · recovering<\u002Fspan><\u002Fdiv><div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,62ch),1fr));gap:24px;font-family:'JetBrains Mono',monospace;font-size:12.5px\"><figure style=\"margin:0;display:flex;flex-direction:column;gap:8px\"><div style=\"border:1px solid rgba(32,31,29,.2);border-radius:4px;overflow-x:auto\"><div style=\"white-space:pre;display:flex;flex-direction:column;line-height:1.55;background:var(--t-bg,#1c1b19);color:var(--t-fg,#e9e5de);padding:1.2em 2ch;min-height:22em\"><div style=\"display:flex;justify-content:space-between\"><span><span style=\"color:var(--t-acc)\">dipo<\u002Fspan><span style=\"color:var(--t-dim)\"> / <\u002Fspan>dipsaus-orchestrator<\u002Fspan><span style=\"color:var(--t-err)\">✗ offline since 13:40 · view frozen<\u002Fspan><\u002Fdiv><div style=\"height:1.55em;background:linear-gradient(var(--t-faint),var(--t-faint)) center/100% 1px no-repeat\"><\u002Fdiv><div style=\"color:var(--t-shade)\">NEEDS YOU                                  6<\u002Fdiv><div style=\"color:var(--t-shade)\">  ! plan limit reached                ~14:00<\u002Fdiv><div style=\"color:var(--t-shade)\">  ? DIPO-450 keep the ordinal?           12m<\u002Fdiv><div style=\"color:var(--t-shade)\">  ○ DIPO-446 Planning tools…              8m<\u002Fdiv><div> <\u002Fdiv><div>  <span style=\"color:var(--t-err)\">✗<\u002Fspan> <span style=\"color:var(--t-hi)\">Lost the daemon. Reconnecting every 2 s…<\u002Fspan><\u002Fdiv><div style=\"color:var(--t-dim)\">    What you see is from 13:40. Actions are off.<\u002Fdiv><div style=\"color:var(--t-dim)\">    The daemon keeps working if it’s still up.<\u002Fdiv><div> <\u002Fdiv><div style=\"height:1.55em;background:linear-gradient(var(--t-faint),var(--t-faint)) center/100% 1px no-repeat\"><\u002Fdiv><div style=\"color:var(--t-dim)\">↑↓ move   ⏎ read   <span style=\"color:var(--t-acc)\">q<\u002Fspan> quit   <span style=\"color:var(--t-err)\">actions off while offline<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv><figcaption style=\"font-family:Lora,serif;font-size:13px;color:#605d5d;text-wrap:pretty\">The existing <code>OFFLINE … view frozen<\u002Fcode> becomes a state you can see: the body is greyed (<code>shade<\u002Fcode>) so stale data can’t be mistaken for live data, reading still works, and action keys disappear from the footer instead of failing when pressed.<\u002Ffigcaption><\u002Ffigure><figure style=\"margin:0;display:flex;flex-direction:column;gap:8px\"><div style=\"border:1px solid rgba(32,31,29,.2);border-radius:4px;overflow-x:auto\"><div style=\"white-space:pre;display:flex;flex-direction:column;line-height:1.55;background:var(--t-bg,#1c1b19);color:var(--t-fg,#e9e5de);padding:1.2em 2ch;min-height:22em\"><div style=\"display:flex;justify-content:space-between\"><span><span style=\"color:var(--t-acc)\">dipo<\u002Fspan><span style=\"color:var(--t-dim)\"> / <\u002Fspan>dipsaus-orchestrator<\u002Fspan><span style=\"color:var(--t-acc)\">◌ daemon recovering<\u002Fspan><\u002Fdiv><div style=\"height:1.55em;background:linear-gradient(var(--t-faint),var(--t-faint)) center/100% 1px no-repeat\"><\u002Fdiv><div>  <span style=\"color:var(--t-acc)\">!<\u002Fspan> <span style=\"color:var(--t-hi)\">Database unavailable<\u002Fspan><\u002Fdiv><div> <\u002Fdiv><div><span style=\"color:var(--t-dim)\">    reason  <\u002Fspan>migration 0004 failed: disk full<\u002Fdiv><div><span style=\"color:var(--t-dim)\">    backup  <\u002Fspan>dipo.db.2026-11-06T09-12.bak<\u002Fdiv><div> <\u002Fdiv><div style=\"color:var(--t-dim)\">    Stories and code are safe: they live in git.<\u002Fdiv><div style=\"color:var(--t-dim)\">    Only run history is at stake.<\u002Fdiv><div> <\u002Fdiv><div>    <span style=\"color:var(--t-acc)\">l<\u002Fspan> open daemon log   <span style=\"color:var(--t-acc)\">y<\u002Fspan> copy the restore command<\u002Fdiv><div style=\"color:var(--t-dim)\">    $ dipo daemon logs<\u002Fdiv><\u002Fdiv><\u002Fdiv><figcaption style=\"font-family:Lora,serif;font-size:13px;color:#605d5d;text-wrap:pretty\"><code>recovering<\u002Fcode> because of the database (DIPO-111/120) gets a full body instead of one yellow banner line. It opens with the reassurance the docs promise (“losing it loses history, not work”) and ends with the next step. A plain reconcile shows only the header chip, with no body.<\u002Ffigcaption><\u002Ffigure><\u002Fdiv><\u002Fsection>\n\n<section id=\"s9\" style=\"display:flex;flex-direction:column;gap:18px\"><div style=\"display:flex;align-items:baseline;gap:14px;border-bottom:1px solid rgba(32,31,29,.16);padding-bottom:10px\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;border:1px solid #b68235;color:#7d5411;padding:2px 8px;border-radius:2px\">S9<\u002Fspan><h3 style=\"font-family:'Cormorant Garamond',serif;font-weight:600;font-size:28px;margin:0\">Keys overlay<\u002Fh3><span style=\"color:#605d5d;font-size:14px\">? · built from the same registry as the footer and palette<\u002Fspan><\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start\"><div style=\"flex:0 1 auto;max-width:100%;overflow-x:auto;border:1px solid rgba(32,31,29,.2);border-radius:4px;box-shadow:0 3px 10px rgba(45,43,43,.14)\"><div style=\"box-sizing:content-box;width:112ch;height:34em;position:relative;display:flex;flex-direction:column;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.55;white-space:pre;background:var(--t-bg,#1c1b19);color:var(--t-fg,#e9e5de);padding:1.2em 2ch\"><div style=\"color:v
