# Decision 0016 rules 1 and 4: the smoke test of a built `dist/dipo`, shared by the CI `smoke`
# job and the release `build` job so both check a binary the same way. Runs after checkout and
# `bun scripts/build.ts`, on a macOS arm64 runner: darwin-arm64 is the one target (0004).
name: smoke
description: Smoke-test dist/dipo on its native runner.

inputs:
  target:
    description: The target without the `bun-` prefix, for example darwin-arm64.
    required: true
  expected-file:
    description: Text that `file dist/dipo` must contain.
    required: true
  release:
    description: '"true" when the binary was built with --release, so its version has no -dev suffix.'
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: dipo --version
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        RELEASE: ${{ inputs.release }}
      run: |
        version="$(jq -r .version package.json)"
        if [ "$RELEASE" != "true" ]; then version="$version-dev"; fi
        commit="$(git rev-parse --short=12 HEAD)"
        out="$(./dist/dipo --version)"
        echo "$out"
        case "$out" in
          "dipo $version ($commit "????-??-??") bun "*" $TARGET") ;;
          *) echo "expected dipo $version ($commit <date>) bun <version> $TARGET"; exit 1 ;;
        esac
        json="$(./dist/dipo --version --json)"
        echo "$json"
        echo "$json" | jq -e --arg v "$version" --arg c "$commit" --arg t "$TARGET" \
          '.version == $v and .commit == $c and "\(.os)-\(.arch)" == $t' > /dev/null
    - name: dipo --help
      shell: bash
      run: ./dist/dipo --help
    - name: file
      shell: bash
      env:
        EXPECTED_FILE: ${{ inputs.expected-file }}
      run: |
        out="$(file dist/dipo)"
        echo "$out"
        case "$out" in
          *"$EXPECTED_FILE"*) ;;
          *) echo "expected: $EXPECTED_FILE"; exit 1 ;;
        esac
    - name: codesign -v
      shell: bash
      run: codesign -v dist/dipo
    - name: dipo self-check
      shell: bash
      env:
        DIPO_TMP: ${{ runner.temp }}/dipo
      run: ./dist/dipo self-check
    - name: The binary ignores bunfig.toml and .env in its working directory
      shell: bash
      run: |
        dir="$(mktemp -d)"
        printf 'preload = ["./planted.ts"]\n' > "$dir/bunfig.toml"
        printf 'require("fs").writeFileSync("%s/ran", "1")\n' "$dir" > "$dir/planted.ts"
        (cd "$dir" && "$GITHUB_WORKSPACE/dist/dipo" --version)
        if [ -e "$dir/ran" ]; then echo "bunfig.toml preload ran"; exit 1; fi
        # A planted .env must not reach the binary either (BUN_OPTIONS would preload code).
        rm "$dir/bunfig.toml"
        printf 'BUN_OPTIONS=--preload ./planted.ts\n' > "$dir/.env"
        (cd "$dir" && "$GITHUB_WORKSPACE/dist/dipo" --version)
        if [ -e "$dir/ran" ]; then echo ".env BUN_OPTIONS preload ran"; exit 1; fi
