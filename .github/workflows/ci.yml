# Decision 0016 rule 1. Required check: `ci-ok` (rule 2).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # 0016: a PR that changes only backlog/ takes the light path. This job decides it; on that path the
  # heavy jobs below skip by design, and ready-gate and pr-title still run. Every push to main and
  # every other PR runs every job.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      # Depth 2: on a PR the checkout is GitHub's merge commit, whose first parent is the base and
      # whose second is the PR head, so HEAD^1...HEAD is exactly what the PR changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      # The scope is decided here with git and the shell, never by code from the PR's checkout, so
      # a PR cannot change the decision without a change under .github/ (code-owner review). Light
      # only when every changed entry is a regular file on both sides (mode 100644, or 000000 where
      # it is absent) whose path is a .md file under backlog/ or backlog/config.yml. A symlink, a
      # submodule, an executable, any other path and an empty diff are full. -z keeps paths with
      # spaces or newlines whole; output that does not end in a whole entry is full.
      - name: Classify the changed paths
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "scope=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(git rev-parse HEAD^2)" != "$PR_HEAD" ]; then
            echo "The checkout is not the merge commit of the PR head $PR_HEAD"
            exit 1
          fi
          diff="$RUNNER_TEMP/changes.raw"
          git diff --raw -z --no-renames HEAD^1 HEAD > "$diff"
          scope=backlog-only
          count=0
          meta=""
          while IFS= read -r -d '' meta && IFS= read -r -d '' path; do
            count=$((count + 1))
            read -r from to _ <<< "${meta#:}"
            case "$from" in 100644 | 000000) ;; *) scope=full ;; esac
            case "$to" in 100644 | 000000) ;; *) scope=full ;; esac
            case "$path" in backlog/config.yml | backlog/*.md) ;; *) scope=full ;; esac
            meta=""
          done < "$diff"
          if [ "$count" -eq 0 ] || [ -n "$meta" ]; then
            scope=full
          fi
          echo "$count changed entries: $scope"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

  # 0016: the Ready gate on every Ready story, on every PR and push, and on a backlog-only PR the
  # structural check of 0010 on every story the PR changes.
  ready-gate:
    name: ready-gate
    needs: changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: The Ready gate on every Ready story
        run: bun scripts/check-ready-gate.ts
      # The changes job checked that the checkout is the PR's merge commit, so HEAD^1 is the base.
      - name: The structural check on the stories the PR changes (0010)
        if: needs.changes.outputs.scope == 'backlog-only'
        run: bun scripts/check-backlog-pr.ts HEAD^1 HEAD

  verify:
    name: verify
    needs: changes
    if: needs.changes.outputs.scope != 'backlog-only'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # 0017 section 1: CI runs the same verify, plus the CI-only `*.ci.test.ts` files.
      DIPO_TEST_CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # The CI-only sandbox tests (DIPO-37) run steps inside `srt`, which needs bubblewrap, socat and
      # ripgrep, and a user namespace that Ubuntu 24.04's AppArmor restriction leaves usable (0008).
      # The Safe-Chain worker shell test (DIPO-103) needs zsh, which the runner image lacks.
      - name: Install the sandbox runtime's Linux dependencies (0008)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap socat ripgrep zsh
      - name: Allow unprivileged user namespaces for bubblewrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun run verify

  # DIPO-316: the same verify with the CI-only tests on macOS, where the maintainer runs the daemon
  # and the boxes. The macOS image has zsh and the system sandbox (Seatbelt) the CI-only sandbox
  # tests start srt in.
  verify-macos:
    name: verify-macos
    needs: changes
    if: needs.changes.outputs.scope != 'backlog-only'
    runs-on: macos-26
    permissions:
      contents: read
    env:
      DIPO_TEST_CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # srt and its tests look for ripgrep, as on Linux (0008); install it only when the image lacks it.
      - name: Make sure ripgrep is installed
        run: command -v rg || brew install ripgrep
      - run: bun run verify

  dependency-review:
    name: dependency-review
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.scope != 'backlog-only'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, CC0-1.0, BlueOak-1.0.0

  # 0016 rule 1: build with the release script and smoke-test the binary natively on each target.
  smoke:
    name: smoke (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.scope != 'backlog-only'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
            file: "Mach-O 64-bit executable arm64"
          - target: darwin-x64
            runner: macos-26-intel
            file: "Mach-O 64-bit executable x86_64"
          - target: linux-x64
            runner: ubuntu-24.04
            file: "ELF 64-bit LSB executable, x86-64"
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            file: "ELF 64-bit LSB executable, ARM aarch64"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun scripts/build.ts --target "bun-$TARGET"
      - uses: ./.github/actions/smoke
        with:
          target: ${{ matrix.target }}
          expected-file: ${{ matrix.file }}

  # 0016 rule 1: install.sh and any other shell script in the repository (rule 7).
  shellcheck:
    name: shellcheck
    needs: changes
    if: needs.changes.outputs.scope != 'backlog-only'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # shellcheck comes with the ubuntu-24.04 image.
      - run: shellcheck --version
      # install.sh must exist, so a rename cannot silently drop it from the check.
      - name: shellcheck install.sh and every other tracked shell script
        run: |
          test -f install.sh
          git ls-files -z "*.sh" | xargs -0 shellcheck --severity=style

  # DIPO-321: lint every workflow under .github/workflows/ with actionlint, which also runs the
  # runner image's shellcheck on each `run:` script. The release archive is pinned by version and
  # SHA-256, copied from actionlint_<version>_checksums.txt on the actionlint release page.
  actionlint:
    name: actionlint
    needs: changes
    if: needs.changes.outputs.scope != 'backlog-only'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download actionlint and check it against the pinned SHA-256
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: |
          shellcheck --version
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint" -color

  ci-ok:
    name: ci-ok
    needs:
      [changes, ready-gate, verify, verify-macos, shellcheck, actionlint, dependency-review, smoke]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Check that every needed job succeeded or was skipped by design
        env:
          EVENT: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # Skipped by design, and nothing else: dependency-review outside pull requests, and the
          # heavy jobs on a pull request that the changes job (which itself succeeded) found changes
          # only backlog/ (0016). changes and ready-gate must always succeed.
          failed=$(echo "$NEEDS" | jq -r --arg event "$EVENT" '
            (.changes.result == "success" and .changes.outputs.scope == "backlog-only") as $light
            | to_entries[]
            | select(.value.result != "success")
            | select(
                .value.result != "skipped"
                or (
                  (.key == "dependency-review" and $event != "pull_request")
                  or ($event == "pull_request" and $light
                    and (.key | IN("verify", "verify-macos", "shellcheck", "actionlint", "dependency-review", "smoke")))
                  | not))
            | .key')
          if [ -n "$failed" ]; then
            echo "Not green: $failed"
            exit 1
          fi
