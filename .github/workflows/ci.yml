# Decision 0016 rule 1. Required check: `ci-ok` (rule 2).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # 0017 section 1: CI runs the same verify, plus the CI-only `*.ci.test.ts` files.
      DIPO_TEST_CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # The CI-only sandbox tests (DIPO-37) run steps inside `srt`, which needs bubblewrap, socat and
      # ripgrep, and a user namespace that Ubuntu 24.04's AppArmor restriction leaves usable (0008).
      # The Safe-Chain worker shell test (DIPO-103) needs zsh, which the runner image lacks.
      - name: Install the sandbox runtime's Linux dependencies (0008)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap socat ripgrep zsh
      - name: Allow unprivileged user namespaces for bubblewrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun run verify

  # DIPO-316: the same verify with the CI-only tests on macOS, where the maintainer runs the daemon
  # and the boxes. The macOS image has zsh and the system sandbox (Seatbelt) the CI-only sandbox
  # tests start srt in.
  verify-macos:
    name: verify-macos
    runs-on: macos-26
    permissions:
      contents: read
    env:
      DIPO_TEST_CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # srt and its tests look for ripgrep, as on Linux (0008); install it only when the image lacks it.
      - name: Make sure ripgrep is installed
        run: command -v rg || brew install ripgrep
      - run: bun run verify

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, CC0-1.0, BlueOak-1.0.0

  # 0016 rule 1: build with the release script and smoke-test the binary natively on each target.
  smoke:
    name: smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-26
            file: "Mach-O 64-bit executable arm64"
          - target: darwin-x64
            runner: macos-26-intel
            file: "Mach-O 64-bit executable x86_64"
          - target: linux-x64
            runner: ubuntu-24.04
            file: "ELF 64-bit LSB executable, x86-64"
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            file: "ELF 64-bit LSB executable, ARM aarch64"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Build
        run: bun scripts/build.ts --target "bun-$TARGET"
      - uses: ./.github/actions/smoke
        with:
          target: ${{ matrix.target }}
          expected-file: ${{ matrix.file }}

  # 0016 rule 1: install.sh and any other shell script in the repository (rule 7).
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # shellcheck comes with the ubuntu-24.04 image.
      - run: shellcheck --version
      # install.sh must exist, so a rename cannot silently drop it from the check.
      - name: shellcheck install.sh and every other tracked shell script
        run: |
          test -f install.sh
          git ls-files -z "*.sh" | xargs -0 shellcheck --severity=style

  # DIPO-321: lint every workflow under .github/workflows/ with actionlint, which also runs the
  # runner image's shellcheck on each `run:` script. The release archive is pinned by version and
  # SHA-256, copied from actionlint_<version>_checksums.txt on the actionlint release page.
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download actionlint and check it against the pinned SHA-256
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: |
          shellcheck --version
          "$RUNNER_TEMP/actionlint" -version
          "$RUNNER_TEMP/actionlint" -color

  ci-ok:
    name: ci-ok
    needs: [verify, verify-macos, shellcheck, actionlint, dependency-review, smoke]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Check that every needed job succeeded or was skipped by design
        env:
          EVENT: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # dependency-review is skipped by design outside pull requests; nothing else may be skipped.
          failed=$(echo "$NEEDS" | jq -r --arg event "$EVENT" '
            to_entries[]
            | select(.value.result != "success")
            | select(.key != "dependency-review" or $event == "pull_request" or .value.result != "skipped")
            | .key')
          if [ -n "$failed" ]; then
            echo "Not green: $failed"
            exit 1
          fi
