# Decision 0016 rule 1. Required check: `ci-ok` (rule 2). Smoke builds are added by DIPO-17.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      # 0017 section 1: CI runs the same verify, plus the CI-only `*.ci.test.ts` files.
      DIPO_TEST_CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run verify

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: MIT, ISC, BSD-2-Clause, BSD-3-Clause, Apache-2.0, 0BSD, CC0-1.0, BlueOak-1.0.0

  ci-ok:
    name: ci-ok
    needs: [verify, dependency-review]
    if: always()
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Check that every needed job succeeded or was skipped by design
        env:
          EVENT: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # dependency-review is skipped by design outside pull requests; nothing else may be skipped.
          failed=$(echo "$NEEDS" | jq -r --arg event "$EVENT" '
            to_entries[]
            | select(.value.result != "success")
            | select(.key != "dependency-review" or $event == "pull_request" or .value.result != "skipped")
            | .key')
          if [ -n "$failed" ]; then
            echo "Not green: $failed"
            exit 1
          fi
